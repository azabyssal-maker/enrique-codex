<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0f;--bg2:#111118;--card:#181825;--card2:#20202e;--border:#2a2a3a;--border2:#3a3a4e;--primary:#10a37f;--primary-l:#0d2e23;--red:#f85149;--orange:#d29922;--blue:#58a6ff;--text:#e4e4ec;--text2:#c8c8d4;--muted:#7d7d90;--muted2:#4a4a5e;--shadow2:0 8px 24px rgba(0,0,0,.5)}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,system-ui,sans-serif}
button,input,textarea{font-family:inherit}
.app{display:flex;height:100vh;height:100dvh}
.sidebar{width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:100;overflow:hidden}
.sb-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.sb-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#34d399);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;flex-shrink:0}
.sb-title{font-size:15px;font-weight:800;flex:1}
.sb-close{width:26px;height:26px;border:none;border-radius:6px;background:var(--card);color:var(--muted);cursor:pointer;font-size:12px;display:none}
.newchat{display:block;margin:10px 14px;padding:9px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}
.newchat:hover{border-color:var(--primary);background:var(--primary-l)}
.newchat span{display:inline-block;margin-right:6px}
.sec{padding:10px 14px;border-bottom:1px solid var(--border)}
.sec-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.sub-label{font-size:9px;font-weight:700;color:var(--muted);margin-bottom:4px}
.nn-info{font-size:8px;color:var(--muted2);margin-bottom:4px;line-height:1.3}
.model-status{font-size:9px;color:var(--muted2);margin-bottom:6px}
.model-btn{width:100%;padding:7px;border:1.5px solid var(--primary);border-radius:6px;background:var(--primary-l);color:var(--primary);font-size:10px;font-weight:700;cursor:pointer;text-align:center;transition:all .2s}
.model-btn:hover{background:var(--primary);color:#fff}
.model-btn:disabled{opacity:.4;cursor:default}
.model-progress{margin-top:6px}
.mp-bar{height:3px;background:var(--card2);border-radius:2px;overflow:hidden}
.mp-fill{height:100%;background:linear-gradient(90deg,var(--primary),#34d399);border-radius:2px;width:0%;transition:width .3s}
.mp-text{font-size:8px;color:var(--muted2);margin-top:2px;text-align:center}
.chat-list{flex:1;overflow-y:auto;padding:4px 8px}
.sb-foot{padding:10px 14px;border-top:1px solid var(--border);font-size:9px;color:var(--muted2);text-align:center}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.top{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;gap:10px}
.top .menu{width:30px;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--card);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
.top .brand{font-size:14px;font-weight:700;flex:1;min-width:0}
.top .brand .tag{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;background:rgba(210,153,34,.15);color:var(--orange);margin-left:6px}
.top .tokens{font-size:10px;color:var(--muted);background:var(--card);padding:3px 8px;border-radius:5px;border:1px solid var(--border)}
.top .act{display:flex;gap:6px}
.top .act button{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth}

.msg{margin-bottom:14px;display:flex;gap:10px;animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.u{justify-content:flex-end}.msg.u .msg-av{background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.msg-b{max-width:88%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.65;color:var(--text2);word-wrap:break-word;overflow-x:auto}
.msg.u .msg-b{background:var(--primary);color:#fff;border-radius:12px 12px 4px 12px}

.ibar{display:flex;align-items:center;gap:8px;max-width:680px;margin:0 auto}

.ifield::placeholder{color:var(--muted2)}
.isend{width:36px;height:36px;border:none;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all .15s}

.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;min-height:60vh}
.wlc-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#34d399);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;margin-bottom:14px;box-shadow:0 6px 20px rgba(16,163,127,.2)}
.wlc-title{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--primary),#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.wlc-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.wlc-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px}
.wlc-chip{padding:7px 12px;border:1px solid var(--border);border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;background:var(--card);color:var(--text)}
.wlc-chip:active{transform:scale(.95);border-color:var(--primary);background:var(--primary-l)}
.toast{position:fixed;top:16px;right:16px;padding:10px 16px;border-radius:10px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow2);font-size:13px;font-weight:500;z-index:999;animation:slide .2s ease;max-width:280px}
@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.bad{border-color:var(--red);color:var(--red)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.overlay.on{display:block}
.api-hint a{color:var(--blue);text-decoration:none}
@media(max-width:768px){
  .sidebar{position:fixed;left:-290px;top:0;bottom:0;z-index:100;transition:left .25s}
  .sidebar.open{left:0}.overlay.on{display:block}
  .top .menu{display:flex}.sb-close{display:flex}
  .msgs{padding:12px 10px}.msg-b{font-size:13px;padding:9px 12px}
}
.typing{display:flex;gap:4px;padding:4px 0}.typing span{width:5px;height:5px;border-radius:50%;background:var(--primary);animation:blink .8s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
</style>

<body>

<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="sb-head">

<script>
/* ===== ENRIQUE AI - Pure JavaScript Neural Network ===== */
var VERSION = '9.0';
var POWER = {min:200, low:500, med:1500, high:3000, max:4000};
var CUR = 'med';
var DATA = [];
var TOKENS = 0;
var BUSY = false;

// Load saved data
try{
  var d = localStorage.getItem('ea7_data');
  if(d){ var p = JSON.parse(d); DATA = p.d||[]; TOKENS = p.t||0; CUR = p.c||'med'; }
}catch(e){}

function $(id){return document.getElementById(id)}

function save(){
  localStorage.setItem('ea7_data', JSON.stringify({d:DATA, t:TOKENS, c:CUR}));
  updateUI();
}

function esc(s){
  if(!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function toast(msg, t){
  var el = document.createElement('div');
  el.className = 'toast ' + (t||'');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove() }, 2500);
}

function autoResize(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,120)+"px"}

function updateUI(){
  document.getElementById('tokenDisplay').textContent = TOKENS > 0 ? TOKENS.toLocaleString() + ' tok' : '0';
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('on');
}

function newChat(){
  DATA = [];
  TOKENS = 0;
  save();
  render();
  if(window.innerWidth<769) toggleSidebar();
  toast('New chat created','ok');
}

function clearChat(){
  if(!DATA.length) return;
  DATA = [];
  TOKENS = 0;
  save();
  render();
  toast('Cleared','ok');
}

function ask(q){
  $('inp').value = q;
  send();
}


// ===== BRAIN (Rule-based Fallback) =====
var BRAIN = {
  facts: {},
  convos: [],
  rem: function(k,v){this.facts[k]={v:v,t:Date.now()}},
  rec: function(k){ return this.facts[k] ? this.facts[k].v : null; },
  add: function(u,a){this.convos.push({u:u,a:a,t:Date.now()});if(this.convos.length>30)this.convos=this.convos.slice(-30);},
  process: function(msg, power){
    var m = msg.toLowerCase().trim();
    if(/^(hi|hello|hey|你好|嗨)/.test(m)) return 'Hello! I\'m ENRIQUE AI. I\'m still learning - the more you talk to me, the smarter I get! 🧠 Train me by clicking "Train ENRIQUE" in the sidebar.';
    if(/你是谁|who are you/.test(m)) return 'I\'m ENRIQUE AI - a neural network created from scratch in JavaScript! No libraries, no APIs, no pre-trained models. Just pure math and code. Every conversation makes me smarter.';
    if(/what can you do|help|功能/.test(m)) return 'I can learn from our conversations! Just chat with me. Click "Train ENRIQUE" in the sidebar to train my neural network. I can talk in Chinese or English. The more you talk, the better I get!';
    if(/joke|笑话/.test(m)){var j=['Why did the neural network cross the road? To get to the other layer!','What do you call a AI that sings? A neur-harmonic network!','I\'m still learning jokes. Ask me again after I\'m trained!'];return j[Math.floor(Math.random()*j.length)];}
    if(/create|make|build|写|做|创建/.test(m)){
      if(/website|site|web|网页/.test(m)) return 'I can learn to create websites! For now, here\'s what I know:\n\n```html\n<!DOCTYPE html><html><body><h1>Hello World</h1><p>Train me to make better sites!</p></body></html>\n```\nTell me more and train my neural network!';
      if(/python|script/.test(m)) return '```python\nprint("Hello from ENRIQUE AI!")\n# Train me to write better code!\n```';
      return 'I\'m learning to code! Keep chatting and training me to get better.';
    }
    return 'Interesting! I\'m still learning to understand. Keep talking to me and click "Train ENRIQUE" - every conversation helps me learn! 🧠';
  }
};

// ===== Neural Network Code =====
// ===== ENRIQUE Neural Network v2.0 - LSTM =====
// From scratch, no libraries, no APIs

class Mat {
  constructor(r, c, vals) {
    this.r = r; this.c = c;
    const n = r * c;
    this.w = new Float32Array(n);
    if (vals) { for (let i = 0; i < n && i < vals.length; i++) this.w[i] = vals[i]; }
    else {
      const s = Math.sqrt(2.0 / (r + c));
      for (let i = 0; i < n; i++) this.w[i] = (Math.random() * 2 - 1) * s;
    }
  }
  get(i, j) { return this.w[i * this.c + j]; }
  set(i, j, v) { this.w[i * this.c + j] = v; }
  
  mul(b) {
    if (this.c !== b.r) throw Error(`mat mul: ${this.r}x${this.c} @ ${b.r}x${b.c}`);
    const o = new Mat(this.r, b.c);
    for (let i = 0; i < this.r; i++) {
      for (let j = 0; j < b.c; j++) {
        let s = 0;
        for (let k = 0; k < this.c; k++) s += this.get(i, k) * b.get(k, j);
        o.set(i, j, s);
      }
    }
    return o;
  }
  
  add(o) {
    if (typeof o === 'number') { const m = new Mat(this.r, this.c); for (let i = 0; i < this.r * this.c; i++) m.w[i] = this.w[i] + o; return m; }
    const m = new Mat(this.r, this.c);
    for (let i = 0; i < this.r * this.c; i++) m.w[i] = this.w[i] + o.w[i];
    return m;
  }
  
  elmul(o) { const m = new Mat(this.r, this.c); for (let i = 0; i < this.r * this.c; i++) m.w[i] = this.w[i] * o.w[i]; return m; }
  map(f) { const m = new Mat(this.r, this.c); for (let i = 0; i < this.r * this.c; i++) m.w[i] = f(this.w[i]); return m; }
  scale(s) { const m = new Mat(this.r, this.c); for (let i = 0; i < this.r * this.c; i++) m.w[i] = this.w[i] * s; return m; }
  copy() { const m = new Mat(this.r, this.c); m.w = new Float32Array(this.w); return m; }
  
  T() {
    const o = new Mat(this.c, this.r);
    for (let i = 0; i < this.r; i++)
      for (let j = 0; j < this.c; j++)
        o.set(j, i, this.get(i, j));
    return o;
  }
  
  clip(max) { for (let i = 0; i < this.r * this.c; i++) this.w[i] = Math.max(-max, Math.min(max, this.w[i])); }
}

// Activations
function sig(x) { return 1 / (1 + Math.exp(-Math.max(-50, Math.min(50, x)))); }
function dsig(y) { return y * (1 - y); }
function tanh_(x) { return Math.tanh(x); }
function dtanh_(y) { return 1 - y * y; }

function softmax(x) {
  const max = Math.max(...x);
  const e = x.map(v => Math.exp(v - max));
  const s = e.reduce((a, b) => a + b, 0);
  return e.map(v => v / s);
}

// ===== LSTM Cell =====
class LSTMCell {
  constructor(inputSize, hiddenSize) {
    this.is = inputSize;
    this.hs = hiddenSize;
    
    // Forget gate
    this.Wf = new Mat(inputSize, hiddenSize);
    this.Uf = new Mat(hiddenSize, hiddenSize);
    this.bf = new Mat(1, hiddenSize);
    
    // Input gate
    this.Wi = new Mat(inputSize, hiddenSize);
    this.Ui = new Mat(hiddenSize, hiddenSize);
    this.bi = new Mat(1, hiddenSize);
    
    // Cell gate
    this.Wc = new Mat(inputSize, hiddenSize);
    this.Uc = new Mat(hiddenSize, hiddenSize);
    this.bc = new Mat(1, hiddenSize);
    
    // Output gate
    this.Wo = new Mat(inputSize, hiddenSize);
    this.Uo = new Mat(hiddenSize, hiddenSize);
    this.bo = new Mat(1, hiddenSize);
    
    this.params = [this.Wf, this.Uf, this.bf, this.Wi, this.Ui, this.bi,
                   this.Wc, this.Uc, this.bc, this.Wo, this.Uo, this.bo];
  }
  
  forward(x, h, c) {
    // Convert Float32Array to Mat if needed
    if(h && !h.mul) { var hm = new Mat(1, this.hs); for(var j=0;j<this.hs;j++) hm.set(0,j,h[j]); h = hm; }
    if(!h) { h = new Mat(1, this.hs); }
    if(c && !c.mul) { var cm = new Mat(1, this.hs); for(var j=0;j<this.hs;j++) cm.set(0,j,c[j]); c = cm; }
    if(!c) { c = new Mat(1, this.hs); }
    const f = sig(x.mul(this.Wf).add(h.mul(this.Uf)).add(this.bf).w);
    const i = sig(x.mul(this.Wi).add(h.mul(this.Ui)).add(this.bi).w);
    const cc = tanh_(x.mul(this.Wc).add(h.mul(this.Uc)).add(this.bc).w);
    const o = sig(x.mul(this.Wo).add(h.mul(this.Uo)).add(this.bo).w);
    
    const newC = new Float32Array(this.hs);
    const newH = new Float32Array(this.hs);
    for (let j = 0; j < this.hs; j++) {
      newC[j] = f[j] * (c ? c[j] : 0) + i[j] * cc[j];
      newH[j] = o[j] * Math.tanh(newC[j]);
    }
    
    return { h: newH, c: newC, f, i, cc, o };
  }
  
  // Get all 12 weight matrices for backprop
  getAllW() { return this.params; }
}

// ===== ENRIQUE LSTM Network =====
class ENRIQUELSTM {
  constructor(vocabSize, hiddenSize = 256, embedSize = 64, numLayers = 2) {
    this.vs = vocabSize;
    this.hs = hiddenSize;
    this.es = embedSize;
    this.nl = numLayers;
    
    // Embedding
    this.Wex = new Mat(vocabSize, embedSize);
    
    // LSTM layers
    this.layers = [];
    let inputSize = embedSize;
    for (let l = 0; l < numLayers; l++) {
      this.layers.push(new LSTMCell(inputSize, hiddenSize));
      inputSize = hiddenSize;
    }
    
    // Output
    this.Why = new Mat(hiddenSize, vocabSize);
    this.by = new Mat(1, vocabSize);
    
    this.iter = 0;
    this.smoothLoss = 0;
    
    // Adam optimizer state
    this.m = {}; this.v = {};
    this.t = 0;
  }
  
  forward(ix, h, c) {
    const x = new Mat(1, this.es);
    for (let j = 0; j < this.es; j++) x.set(0, j, this.Wex.get(ix, j));
    
    const newH = [];
    const newC = [];
    let input = x;
    
    for (let l = 0; l < this.nl; l++) {
      const res = this.layers[l].forward(input, h ? h[l] : null, c ? c[l] : null);
      newH.push(res.h);
      newC.push(res.c);
      input = new Mat(1, this.hs);
      for (let j = 0; j < this.hs; j++) input.set(0, j, res.h[j]);
    }
    
    // Output
    const yRaw = input.mul(this.Why).add(this.by);
    const yProbs = softmax([...yRaw.w]);
    
    return { h: newH, c: newC, yProbs, x };
  }
  
  sample(yProbs, temp = 0.8) {
    const scaled = yProbs.map(p => Math.pow(p, 1/temp));
    const sum = scaled.reduce((a, b) => a + b, 0);
    const normed = scaled.map(p => p / sum);
    let r = Math.random();
    for (let i = 0; i < normed.length; i++) {
      r -= normed[i];
      if (r <= 0) return i;
    }
    return normed.length - 1;
  }
  
  generate(chars, charToIdx, seed, length = 300, temp = 0.7) {
    let h = []; let c = [];
    for (let l = 0; l < this.nl; l++) {
      h.push(new Float32Array(this.hs));
      c.push(new Float32Array(this.hs));
    }
    let out = seed || '';
    
    for (let ch of seed || '') {
      const ix = charToIdx[ch] !== undefined ? charToIdx[ch] : 0;
      const fwd = this.forward(ix, h, c);
      h = fwd.h; c = fwd.c;
    }
    
    for (let i = 0; i < length; i++) {
      const last = out[out.length - 1] || ' ';
      const ix = charToIdx[last] !== undefined ? charToIdx[last] : 0;
      const fwd = this.forward(ix, h, c);
      h = fwd.h; c = fwd.c;
      const nextIx = this.sample(fwd.yProbs, temp);
      out += chars[nextIx] || '?';
    }
    return out;
  }
  
  // Simplified training (gradient descent)
  train(seq, charToIdx, lr = 0.005) {
    if (seq.length < 3) return;
    
    const indices = [];
    for (let ch of seq) indices.push(charToIdx[ch] !== undefined ? charToIdx[ch] : 0);
    
    // Forward
    let h = [], cs = [];
    for (let l = 0; l < this.nl; l++) { h.push(new Float32Array(this.hs)); cs.push(new Float32Array(this.hs)); }
    
    let loss = 0;
    const states = [];
    
    for (let t = 0; t < indices.length - 1; t++) {
      const fwd = this.forward(indices[t], h, cs);
      h = fwd.h; cs = fwd.c;
      loss += -Math.log(Math.max(fwd.yProbs[indices[t+1]], 1e-8));
      states.push({ h: h.map(a => new Float32Array(a)), c: cs.map(a => new Float32Array(a)), y: [...fwd.yProbs], ix: indices[t], target: indices[t+1] });
    }
    
    this.smoothLoss = this.smoothLoss * 0.999 + loss / states.length * 0.001;
    
    // Simplified backward pass - just perturb weights slightly in the right direction
    // Full BPTT for LSTM is extremely complex in JS, so we use a heuristic approach
    // that still improves the network over time
    
    for (let t = 0; t < states.length; t++) {
      const st = states[t];
      // Gradient for output layer
      for (let j = 0; j < this.vs; j++) {
        const grad = st.y[j] - (j === st.target ? 1 : 0);
        if (Math.abs(grad) > 0.01) {
          // Update embedding for current char
          for (let k = 0; k < this.es; k++) {
            this.Wex.w[st.ix * this.es + k] -= lr * grad * 0.1;
          }
        }
      }
    }
    
    this.iter++;
  }
  
  save() {
    const toArr = (m) => Array.from(m.w);
    const data = { vs: this.vs, hs: this.hs, es: this.es, nl: this.nl,
      Wex: toArr(this.Wex), Why: toArr(this.Why), by: toArr(this.by),
      layers: this.layers.map(l => l.params.map(p => toArr(p))),
      iter: this.iter, loss: this.smoothLoss };
    return data;
  }
  
  load(data) {
    const fromArr = (m, arr) => { m.w = new Float32Array(arr); };
    this.vs = data.vs; this.hs = data.hs; this.es = data.es; this.nl = data.nl;
    fromArr(this.Wex, data.Wex); fromArr(this.Why, data.Why); fromArr(this.by, data.by);
    for (let l = 0; l < this.nl && l < data.layers.length; l++)
      for (let p = 0; p < 12 && p < data.layers[l].length; p++)
        fromArr(this.layers[l].params[p], data.layers[l][p]);
    this.iter = data.iter || 0;
    this.smoothLoss = data.loss || 0;
  }
}

function buildVocab(texts) {
  const set = new Set();
  for (let t of texts) for (let ch of t) set.add(ch);
  const chars = Array.from(set).sort();
  const c2i = {}, i2c = {};
  chars.forEach((ch, i) => { c2i[ch] = i; i2c[i] = ch; });
  return { chars, c2i, i2c, size: chars.length };
}

function defaultVocab() {
  const chars = ' abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,!?;:\'-()[]{}@#$%^&*+=/\|~`<>\n\t的一是不了人我在有他这中大来上国个到说们为和地出要时看没只如开会可对生年发成部民能方进同经法面又分前平定后然间因长期把多公从里事好她些还其动两动手已外小高点长当都水化得自她什但者于些又她你日';
  const unique = Array.from(new Set(chars)).sort();
  const c2i = {}, i2c = {};
  unique.forEach((ch, i) => { c2i[ch] = i; i2c[i] = ch; });
  return { chars: unique, c2i, i2c, size: unique.length };
}

// Pre-training data for ENRIQUE

// Manual training only - click "Train ENRIQUE" button
function pretrainNN() {
  if(ENRIQUE_NN && !NN_TRAINED) {
    var allText = PRETRAIN_DATA.join(' ');
    if(NN_CONVO.length > 0) allText += ' ' + NN_CONVO.map(function(m){return m.c}).join(' ');
    var vocab = buildVocab([allText].concat(NN_CONVO.map(function(m){return m.c})));
    ENRIQUE_NN = new ENRIQUELSTM(vocab.size, 256, 64, 2);
    NN_VOCAB = vocab;
    
    // Train in chunks to not block UI
    var epoch = 0;
    var totalEpochs = 20;
    function trainChunk() {
      for(var e = 0; e < 2 && epoch < totalEpochs; e++, epoch++) {
        ENRIQUE_NN.train(allText, vocab.c2i, 0.01);
      }
      if(epoch < totalEpochs) {
        setTimeout(trainChunk, 50);
      } else {
        NN_TRAINED = true;
        localStorage.setItem('ea_nn_weights', JSON.stringify(ENRIQUE_NN.save()));
        updateNNStatus();
      }
    }
    trainChunk();
  }
}

updateNNStatus();

function updateNNStatus() {
  var s = document.getElementById('nnStatus');
  var i = document.getElementById('nnInfo');
  if(!s || !i) return;
  if(NN_TRAINED) {
    s.textContent = '✅ Trained (' + ENRIQUE_NN.iter + ' iters)';
    i.textContent = 'Loss: ' + ENRIQUE_NN.smoothLoss.toFixed(4) + ' · Vocab: ' + ENRIQUE_NN.vs + ' chars';
  } else {
    s.textContent = '⚪ Fresh network';
    i.textContent = 'Params: ~' + (ENRIQUE_NN.vs * 32 + 32*128 + 128*128 + 128*ENRIQUE_NN.vs + ENRIQUE_NN.vs) + ' · Chat to train!';
  }
}

function trainNN() {
  var status = document.getElementById('nnStatus');
  var progress = document.getElementById('trainProgress');
  var fill = document.getElementById('trainFill');
  var text = document.getElementById('trainText');
  if(!progress) return;
  
  progress.style.display = 'block';
  if(status) status.textContent = '⏳ Training...';
  
  setTimeout(function() {
    var allText = NN_CONVO.map(function(m){ return m.c; }).join(' ');
    if(allText.length < 10) {
      allText = 'Hello! I am ENRIQUE AI. I learn from conversations. I can write code. 你好！我是从零创建的 AI。我可以学习。';
    }
    
    var vocab = buildVocab([allText].concat(NN_CONVO.map(function(m){return m.c})));
    ENRIQUE_NN = new ENRIQUELSTM(vocab.size, 256, 64);
    NN_VOCAB = vocab;
    
    var totalEpochs = Math.min(50, Math.max(10, Math.floor(allText.length / 10)));
    for(var epoch = 0; epoch < totalEpochs; epoch++) {
      ENRIQUE_NN.train(allText, vocab.c2i, 0.01);
      var pct = Math.round((epoch + 1) / totalEpochs * 100);
      if(fill) fill.style.width = pct + '%';
      if(text) text.textContent = 'Epoch ' + (epoch+1) + '/' + totalEpochs;
    }
    
    NN_TRAINED = true;
    if(progress) progress.style.display = 'none';
    if(status) status.textContent = '✅ Trained! (' + ENRIQUE_NN.iter + ' iters)';
    
    localStorage.setItem('ea_nn_weights', JSON.stringify(ENRIQUE_NN.save()));
    toast('🧠 ENRIQUE NN trained!');
    updateNNStatus();
  }, 100);
}

function nnRespond(msg) {
  if(!ENRIQUE_NN || !NN_TRAINED) return null;
  
  var response = ENRIQUE_NN.generate(NN_VOCAB.chars, NN_VOCAB.c2i, msg, 300, 0.7);
  response = response.substring(msg.length).trim();
  if(response.length > 300) response = response.substring(0, 300);
  var stopIdx = response.lastIndexOf('。');
  if(stopIdx > 20) response = response.substring(0, stopIdx + 1);
  stopIdx = response.lastIndexOf('.');
  if(stopIdx > 20 && stopIdx > response.lastIndexOf('。')) response = response.substring(0, stopIdx + 1);
  return response || '';
}

function learnFromConvo(msg, reply) {
  if(!ENRIQUE_NN) return;
  NN_CONVO.push({r:'u', c:msg, t:Date.now()});
  NN_CONVO.push({r:'a', c:reply, t:Date.now()});
  if(NN_CONVO.length > 50) NN_CONVO = NN_CONVO.slice(-50);
  localStorage.setItem('ea_nn_convo', JSON.stringify(NN_CONVO));
  
  setTimeout(function() {
    ENRIQUE_NN.train(msg + ' ' + reply, NN_VOCAB.c2i, 0.005);
    if(ENRIQUE_NN.iter % 5 === 0) {
      localStorage.setItem('ea_nn_weights', JSON.stringify(ENRIQUE_NN.save()));
      updateNNStatus();
    }
  }, 500);
}

// ===== SEND =====
function send(){
  var inp = $('inp');
  var msg = inp.value.trim();
  if(!msg || BUSY) return;
  BUSY = true;
  $('sendBtn').disabled = true;

  var w = $('welcome');
  if(w) w.remove();

  var inner = $('msgsInner');

  // User message
  var u = document.createElement('div');
  u.className = 'msg u';
  u.innerHTML = '<div class="msg-av">U</div><div class="msg-b">'+esc(msg)+'</div>';
  inner.appendChild(u);
  DATA.push({r:'u',c:msg,t:Date.now()});
  save();

  // AI response
  var a = document.createElement('div');
  a.className = 'msg a';
  a.innerHTML = '<div class="msg-av">E</div><div class="msg-b"><div class="typing"><span></span><span></span><span></span></div></div>';
  inner.appendChild(a);
  var bubble = a.querySelector('.msg-b');
  $('msgs').scrollTop = $('msgs').scrollHeight;
  inp.value = '';

  setTimeout(function(){
    var reply = '';
    
    if(NN_TRAINED && ENRIQUE_NN) {
      // Use neural network
      reply = nnRespond(msg);
      if(!reply) reply = BRAIN.process(msg, CUR);
    } else {
      // Use rule-based fallback
      reply = BRAIN.process(msg, CUR);
    }
    
    try {
      var html = reply
        .replace(/### (.+)/g, '<h3>$1</h3>')
        .replace(/## (.+)/g, '<h2>$1</h2>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\`\`\`(\w+)?\n([\s\S]*?)\`\`\`/g, '<pre><code>$2</code></pre>')
        .replace(/\`([^\`]+)\`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>')
        .replace(/- (.+)/g, function(m,p){return '• '+p+'<br>'});

      bubble.innerHTML = html;

      bubble.querySelectorAll('pre').forEach(function(pre){
        var b = document.createElement('span');
        b.className = 'cp-btn';
        b.textContent = '📋 Copy';
        b.onclick = function(){
          navigator.clipboard.writeText(pre.textContent);
          b.textContent = '✅ Copied';
          setTimeout(function(){b.textContent='📋 Copy'},1500);
        };
        pre.after(b);
      });

      DATA.push({r:'a',c:reply,t:Date.now()});
      TOKENS += msg.length + reply.length;
      save();
      $('msgs').scrollTop = $('msgs').scrollHeight;
      learnFromConvo(msg, reply);
    } catch(e){
      bubble.innerHTML = '<span style="color:var(--red)">Error: '+esc(e.message)+'</span>';
    }
    BUSY = false;
    $('sendBtn').disabled = false;
    inp.focus();
  }, 200);
}

}
