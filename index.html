<body>

<script>
// ================================================================
// ENRIQUE Neural Network v3 - LSTM from Scratch
// 100% Original JavaScript • No Libraries • No APIs
// ================================================================

var D = [], T = 0, B = 0;
var NN = null, VOCAB = null;
var CNV = []; // conversation memory

// ===== Matrix Operations =====
class Mat {
  constructor(r, c, v) {
    this.r = r; this.c = c; this.w = new Float32Array(r * c);
    if (v) { for (var i = 0; i < v.length && i < r*c; i++) this.w[i] = v[i]; }
    else { var s = Math.sqrt(2.0 / (r + c)); for (var i = 0; i < r*c; i++) this.w[i] = (Math.random() * 2 - 1) * s; }
  }
  get(i,j){return this.w[i*this.c+j]}
  set(i,j,v){this.w[i*this.c+j]=v}
  mul(b){
    if(this.c!==b.r) throw Error('mat dims');
    var o=new Mat(this.r,b.c); var n=this.r*b.c;
    for(var i=0;i<this.r;i++) for(var j=0;j<b.c;j++){var s=0; for(var k=0;k<this.c;k++) s+=this.get(i,k)*b.get(k,j); o.set(i,j,s);}
    return o;
  }
  add(o){
    if(typeof o==='number'){var m=new Mat(this.r,this.c);for(var i=0;i<this.r*this.c;i++)m.w[i]=this.w[i]+o;return m;}
    var m=new Mat(this.r,this.c);for(var i=0;i<this.r*this.c;i++)m.w[i]=this.w[i]+o.w[i];return m;
  }
  elmul(o){var m=new Mat(this.r,this.c);for(var i=0;i<this.r*this.c;i++)m.w[i]=this.w[i]*o.w[i];return m;}
  map(f){var m=new Mat(this.r,this.c);for(var i=0;i<this.r*this.c;i++)m.w[i]=f(this.w[i]);return m;}
  scale(s){var m=new Mat(this.r,this.c);for(var i=0;i<this.r*this.c;i++)m.w[i]=this.w[i]*s;return m;}
  copy(){var m=new Mat(this.r,this.c);m.w=new Float32Array(this.w);return m;}
  T(){var o=new Mat(this.c,this.r);for(var i=0;i<this.r;i++)for(var j=0;j<this.c;j++)o.set(j,i,this.get(i,j));return o;}
  clip(m){for(var i=0;i<this.r*this.c;i++)this.w[i]=Math.max(-m,Math.min(m,this.w[i]));}
}

function sig(x){return 1/(1+Math.exp(-Math.max(-50,Math.min(50,x))))}
function dsig(y){return y*(1-y)}
function tanh_(x){return Math.tanh(x)}
function dtanh_(y){return 1-y*y}
function softmax(x){
  var mx=Math.max.apply(null,x), ex=x.map(function(v){return Math.exp(v-mx)}), s=ex.reduce(function(a,b){return a+b},0);
  return ex.map(function(v){return v/s});
}
function randn(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

// ===== LSTM Cell =====
class LSTMC {
  constructor(is, hs) {
    this.is=is; this.hs=hs;
    this.Wf=new Mat(is,hs); this.Uf=new Mat(hs,hs); this.bf=new Mat(1,hs);
    this.Wi=new Mat(is,hs); this.Ui=new Mat(hs,hs); this.bi=new Mat(1,hs);
    this.Wc=new Mat(is,hs); this.Uc=new Mat(hs,hs); this.bc=new Mat(1,hs);
    this.Wo=new Mat(is,hs); this.Uo=new Mat(hs,hs); this.bo=new Mat(1,hs);
    this.p=[this.Wf,this.Uf,this.bf,this.Wi,this.Ui,this.bi,this.Wc,this.Uc,this.bc,this.Wo,this.Uo,this.bo];
  }
  fwd(x, h, c) {
    var f = sig(x.mul(this.Wf).add(h.mul(this.Uf)).add(this.bf).w);
    var i = sig(x.mul(this.Wi).add(h.mul(this.Ui)).add(this.bi).w);
    var cc = tanh_(x.mul(this.Wc).add(h.mul(this.Uc)).add(this.bc).w);
    var o = sig(x.mul(this.Wo).add(h.mul(this.Uo)).add(this.bo).w);
    var cn = new Float32Array(this.hs);
    var hn = new Float32Array(this.hs);
    for (var j=0; j<this.hs; j++) { cn[j] = f[j]*c[j] + i[j]*cc[j]; hn[j] = o[j] * tanh_(cn[j]); }
    return {h:hn, c:cn, f:f, i:i, cc:cc, o:o};
  }
}

// ===== ENRIQUE LSTM =====
class ENRIQUE {
  constructor(vs, hs, es, nl) {
    this.vs=vs; this.hs=hs; this.es=es; this.nl=nl||2;
    this.Wex=new Mat(vs,es);
    this.layers=[]; for(var l=0;l<this.nl;l++) this.layers.push(new LSTMC(l===0?es:hs,hs));
    this.Why=new Mat(hs,vs); this.by=new Mat(1,vs);
    this.iter=0; this.smL=10;
  }
  
  fwd(ix, hs, cs) {
    var x=new Mat(1,this.es);
    for(var j=0;j<this.es;j++) x.set(0,j,this.Wex.get(ix,j));
    var nh=[], nc=[];
    for(var l=0;l<this.nl;l++) {
      var r=this.layers[l].fwd(l===0?x:(new Mat(1,this.hs)).map(function(_,i){return nh[l-1][i]}), 
          hs[l]?new Float32Array(hs[l]):new Float32Array(this.hs), 
          cs[l]?new Float32Array(cs[l]):new Float32Array(this.hs));
      nh.push(r.h); nc.push(r.c);
    }
    var y=this.Why.mul((new Mat(1,this.hs)).map(function(_,i){return nh[this.nl-1][i]})).add(this.by);
    var yp=softmax(y.w);
    return {h:nh, c:nc, y:yp};
  }
  
  sample(yp, temp) {
    var sc=yp.map(function(p){return Math.pow(p,1/temp)});
    var sum=sc.reduce(function(a,b){return a+b},0), norm=sc.map(function(p){return p/sum});
    var r=Math.random();
    for(var i=0;i<norm.length;i++){r-=norm[i];if(r<=0)return i;}
    return norm.length-1;
  }
  
  gen(chars, c2i, prompt, len, temp) {
    temp=temp||0.7; len=len||200;
    var out=prompt||'', hs=[], cs=[];
    for(var l=0;l<this.nl;l++){hs.push(new Float32Array(this.hs));cs.push(new Float32Array(this.hs));}
    for(var i=0;i<out.length;i++){
      var ix=c2i[out[i]]!==undefined?c2i[out[i]]:0;
      var f=this.fwd(ix,hs,cs); hs=f.h; cs=f.c;
    }
    for(var i=0;i<len;i++){
      var last=out[out.length-1]||' ';
      var ix=c2i[last]!==undefined?c2i[last]:0;
      var f=this.fwd(ix,hs,cs); hs=f.h; cs=f.c;
      var ni=this.sample(f.y,temp);
      out+=chars[ni]||'?';
      if(chars[ni]==='.'||chars[ni]==='。'||chars[ni]==='!'||chars[ni]==='？') break;
    }
    return out;
  }
  
  train(seq, c2i, lr) {
    lr=lr||0.002;
    if(seq.length<5) return;
    var idxs=[]; for(var ch of seq) idxs.push(c2i[ch]!==undefined?c2i[ch]:0);
    var hs=[],cs=[]; for(var l=0;l<this.nl;l++){hs.push(new Float32Array(this.hs));cs.push(new Float32Array(this.hs));}
    var loss=0, states=[];
    for(var t=0;t<idxs.length-1;t++){
      var f=this.fwd(idxs[t],hs,cs); hs=f.h; cs=f.c;
      loss+=-Math.log(Math.max(f.y[idxs[t+1]],1e-10));
      states.push({h:hs.map(function(a){return new Float32Array(a)}), c:cs.map(function(a){return new Float32Array(a)}), y:[].concat(f.y), ix:idxs[t], tgt:idxs[t+1]});
    }
    this.smL=this.smL*0.999+loss/states.length*0.001;
    
    // Simplified gradient update with gradient clipping
    for(var t=0;t<states.length;t++){
      var st=states[t];
      for(var j=0;j<this.vs;j++){
        var grad=st.y[j]-(j===st.tgt?1:0);
        if(Math.abs(grad)>0.05){
          grad=Math.max(-5,Math.min(5,grad))*0.1; // clip gradient
          for(var k=0;k<this.es;k++){
            this.Wex.w[st.ix*this.es+k]-=lr*grad;
          }
          for(var k=0;k<this.hs;k++){
            this.Why.w[k*this.vs+j]-=lr*grad*st.h[this.nl-1][k]*0.1;
            this.by.w[j]-=lr*grad*0.1;
          }
        }
      }
    }
    this.iter++;
  }
  
  save(){
    var d={vs:this.vs,hs:this.hs,es:this.es,nl:this.nl,iter:this.iter,loss:this.smL};
    d.Wex=Array.from(this.Wex.w);
    d.layers=this.layers.map(function(l){return l.p.map(function(p){return Array.from(p.w)})});
    d.Why=Array.from(this.Why.w); d.by=Array.from(this.by.w);
    return d;
  }
  
  load(d){
    this.vs=d.vs;this.hs=d.hs;this.es=d.es;this.nl=d.nl||2;
    this.Wex=new Mat(this.vs,this.es,d.Wex);
    this.layers=[]; for(var l=0;l<this.nl&&l<d.layers.length;l++){var lc=new LSTMC(l===0?this.es:this.hs,this.hs); for(var p=0;p<12&&p<d.layers[l].length;p++)lc.p[p]=new Mat(lc.p[p].r,lc.p[p].c,d.layers[l][p]); this.layers.push(lc);}
    this.Why=new Mat(this.hs,this.vs,d.Why);this.by=new Mat(1,this.vs,d.by);
    this.iter=d.iter||0;this.smL=d.loss||10;
  }
}

// ===== Vocabulary =====
function buildVocab(texts){
  var s=new Set(); texts.forEach(function(t){for(var ch of t)s.add(ch)});
  var chars=Array.from(s).sort(), c2i={}, i2c={};
  chars.forEach(function(ch,i){c2i[ch]=i;i2c[i]=ch});
  return {chars:chars,c2i:c2i,i2c:i2c,size:chars.length};
}

function defaultVocab(){
  var chars=' abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,!?;:\'\"-()[]{}@#$%^&*+=/\\|~`<>的一是不了人我在有他这中大来上国个到说们为和地出要时看没只如开会可对生年发成部民能方进同经法面又分前平定后然间因长期把多公从里事好她些还其动两动手已外小高点长当都水化得自她什但者于些又她你日';
  var u=Array.from(new Set(chars)).sort(), c2i={}, i2c={};
  u.forEach(function(ch,i){c2i[ch]=i;i2c[i]=ch});
  return {chars:u,c2i:c2i,i2c:i2c,size:u.length};
}

// ===== Training Data =====
var PRETRAIN = [
  "Hello! I am ENRIQUE AI. I am a neural network built from scratch in JavaScript. I can help you write code, create websites, and answer questions.",
  "你好！我是 ENRIQUE AI。我是一个从零构建的神经网络。我可以帮助你写代码、创建网站和回答问题。",
  "I can create websites. Here is an example: html body h1 Hello World h1 p This is a website created by ENRIQUE AI. p body html",
  "To write Python code: print Hello from ENRIQUE def fibonacci n if n 1 return n return fibonacci n-1 fibonacci n-2",
  "JavaScript function to add two numbers: function add a b return a b",
  "HTML is the language of the web. CSS makes it beautiful. JavaScript makes it interactive.",
  "Machine learning is about teaching computers to learn from data. Neural networks are inspired by the human brain.",
  "I can speak Chinese and English. 我可以说中文和英文。",
  "ENRIQUE AI learns from every conversation. The more we talk the smarter I become.",
  "Coding is fun. Practice makes perfect. Keep learning and building new things."  
];

// ===== Initialize =====
VOCAB = defaultVocab();
try {
  var saved = localStorage.getItem('ea_nn_v3');
  if (saved) {
    var data = JSON.parse(saved);
    NN = new ENRIQUE(data.vs, data.hs, data.es, data.nl);
    NN.load(data);
  }
} catch(e) {}
if (!NN) NN = new ENRIQUE(VOCAB.size, 256, 64, 2);

function updateStat() {
  document.getElementById('nnStat').textContent = NN.iter > 0 ? 'Trained (' + NN.iter + ' iters)' : 'Fresh network';
  document.getElementById('nnParams').textContent = NN.vs * NN.es + NN.es * NN.hs + NN.hs * NN.hs * 4 * NN.nl + NN.hs * NN.vs + NN.vs;
  document.getElementById('nnLoss').textContent = NN.smL < 10 ? NN.smL.toFixed(4) : '-';
  document.getElementById('nnIter').textContent = NN.iter;
  document.getElementById('nnVocab').textContent = NN.vs;
}
updateStat();

// ===== Train =====
function train() {
  var btn = document.getElementById('trainBtn');
  if (NN.iter > 0 && !confirm('Retrain network? This will reset current weights.')) return;
  btn.disabled = true; btn.textContent = '⏳ Training...';
  document.getElementById('progArea').style.display = 'block';
  
  setTimeout(function(){
    var allText = PRETRAIN.join(' ');
    var vocab = buildVocab([allText].concat(PRETRAIN));
    NN = new ENRIQUE(vocab.size, 256, 64, 2);
    VOCAB = vocab;
    
    var epochs = 30;
    function step() {
      for (var e = 0; e < epochs; e++) {
        NN.train(allText, vocab.c2i, 0.005);
        if (NN.iter % 10 === 0) {
          // Gradient clipping safety
          if (isNaN(NN.smL) || NN.smL > 100) break;
        }
      }
      document.getElementById('progBar').style.width = '100%';
      document.getElementById('progText').textContent = 'Training complete!';
      btn.disabled = false; btn.textContent = '🧠 Retrain';
      localStorage.setItem('ea_nn_v3', JSON.stringify(NN.save()));
      updateStat();
    }
    step();
  }, 50);
}

// ===== Generate Response =====
function respond(msg) {
  if (NN.iter < 5) {
    // Fallback for untrained network
    var m = msg.toLowerCase().trim();
    if (/^(hi|hello|hey|你好|嗨)/.test(m)) return '你好！我是 ENRIQUE AI。请先点击"Train Network"训练我的神经网络！';
    if (/python/.test(m)) return 'Python 是一种高级编程语言。训练后我能写 Python 代码！';
    return '我正在学习！请点击侧边栏的 "Train Network" 按钮训练我。训练后我能更好地回答你的问题！';
  }
  
  try {
    var reply = NN.gen(VOCAB.chars, VOCAB.c2i, msg, 300, 0.7);
    reply = reply.substring(msg.length).trim();
    if (reply.length < 3) reply = NN.gen(VOCAB.chars, VOCAB.c2i, '', 200, 0.8);
    var maxLen = 300;
    if (reply.length > maxLen) reply = reply.substring(0, maxLen);
    var idx = Math.max(reply.lastIndexOf('。'), reply.lastIndexOf('.'), reply.lastIndexOf('！'), reply.lastIndexOf('？'));
    if (idx > 20) reply = reply.substring(0, idx + 1);
    return reply || '...';
  } catch(e) {
    return 'Error generating response. Please retrain the network.';
  }
}

function learn(msg, reply) {
  if (!NN || NN.iter < 1) return;
  CNV.push(msg); CNV.push(reply);
  if (CNV.length > 20) CNV = CNV.slice(-20);
  setTimeout(function(){
    NN.train(msg + ' ' + reply, VOCAB.c2i, 0.002);
    if (NN.iter % 5 === 0) {
      localStorage.setItem('ea_nn_v3', JSON.stringify(NN.save()));
      updateStat();
    }
  }, 200);
}

  var w=document.getElementById('welc');if(w)w.remove();
  var mi=document.getElementById('mi');
  var u=document.createElement('div');u.className='msg u';
  u.innerHTML='<div class="av">U</div><div class="mb">'+esc(msg)+'</div>';
  mi.appendChild(u);D.push({r:'u',c:msg,t:Date.now()});sv();
  var a=document.createElement('div');a.className='msg a';
  a.innerHTML='<div class="av">E</div><div class="mb"><div class="ty"><span></span><span></span><span></span></div></div>';
  mi.appendChild(a);var bubble=a.querySelector('.mb');
  document.getElementById('ms').scrollTop=document.getElementById('ms').scrollHeight;
  inp.value='';ah(inp);
  setTimeout(function(){
    try{
      var reply=respond(msg),html='';
      reply.split('\n').forEach(function(l){html+=esc(l)+'<br>'});
      bubble.innerHTML=html;
      D.push({r:'a',c:reply,t:Date.now()});T+=msg.length+reply.length;sv();us();
      document.getElementById('ms').scrollTop=document.getElementById('ms').scrollHeight;
      learn(msg,reply);
    }catch(e){bubble.innerHTML='<span style="color:var(--red)">Error: '+esc(e.message)+'</span>';}
    B=0;document.getElementById('snd').disabled=false;inp.focus();
  },300);
}
function qa(t){document.getElementById('inp').value=t;sd();}
function nw(){D=[];T=0;sv();rd();if(window.innerWidth<769)tsb();ts('New chat');}
function cl(){if(!D.length)return;D=[];T=0;sv();rd();ts('Cleared');}
function esc(s){if(typeof s!='string')s=String(s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

    '</div><div style="margin-top:14px;font-size:10px;color:var(--muted2)">Click "Train Network" in sidebar to start learning</div></div>';

  }
  D.forEach(function(m){

  });
  document.getElementById('ms').scrollTop=document.getElementById('ms').scrollHeight;
}
function us(){document.getElementById('tc').innerHTML=T;document.getElementById('td').innerHTML=T;document.getElementById('mc').innerHTML=D.length}
function tsb(){document.getElementById('sb').classList.toggle('open');document.getElementById('ov').classList.toggle('on')}
function ts(m){var t=document.createElement('div');t.className='ts';t.textContent=' '+m;document.body.appendChild(t);setTimeout(function(){t.remove()},2000)}
function sv(){try{localStorage.setItem('ea_v3',JSON.stringify({d:D,t:T}))}catch(e){}}
(function(){
  try{var d=localStorage.getItem('ea_v3');if(d){var p=JSON.parse(d);D=p.d||[];T=p.t||0}}catch(e){}
  us();rd();
  var inp=document.getElementById('inp');
  inp.addEventListener('input',function(){ah(this)});
  inp.addEventListener('keydown',function(e){if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();sd()}});
