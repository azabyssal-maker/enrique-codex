<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>ENRIQUE GPT - Browser AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0f;--bg2:#111118;--card:#181825;--card2:#20202e;--border:#2a2a3a;--border2:#3a3a4e;--primary:#10a37f;--primary-l:#0d2e23;--primary-d:#0d7a5f;--red:#f85149;--orange:#d29922;--blue:#58a6ff;--purple:#a371f7;--text:#e4e4ec;--text2:#c8c8d4;--muted:#7d7d90;--muted2:#4a4a5e;--font:system-ui,-apple-system,sans-serif}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
button,input,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:2px}
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.sb{width:270px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:100;transition:transform .25s ease}
.sb-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.sb-i{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#34d399);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff}
.sb-t{font-size:15px;font-weight:800;flex:1}
.acts{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.btn{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;width:100%}
.btn:hover{border-color:var(--primary);background:var(--primary-l)}.btn:active{transform:scale(.98)}
.sec{padding:8px 14px;border-bottom:1px solid var(--border)}
.sl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.st{font-size:10px;color:var(--muted2);line-height:1.6;padding:2px 0}
.st em{color:var(--muted)}
.sf{padding:10px 14px;border-top:1px solid var(--border);font-size:9px;color:var(--muted2);text-align:center;margin-top:auto}
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.top{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;gap:10px;min-height:48px}
.top .mu{width:30px;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
.top .br{font-size:14px;font-weight:700;flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.top .br .ta{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;background:rgba(58,106,255,.15);color:var(--blue)}
.top .tk{font-size:10px;color:var(--muted);background:var(--card);padding:3px 8px;border-radius:5px;border:1px solid var(--border)}
.ms{flex:1;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth}
.mi{max-width:720px;margin:0 auto}
.msg{margin-bottom:16px;display:flex;gap:10px;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.u{justify-content:flex-end}
.av{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.msg.u .av{background:var(--card2);border:1px solid var(--border);color:var(--muted);order:1}
.msg.a .av{background:linear-gradient(135deg,var(--blue),#58a6ff);color:#fff}
.mb{max-width:85%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.65;color:var(--text2);word-wrap:break-word;overflow-x:auto}
.msg.u .mb{background:var(--card);border:1px solid var(--border)}
.msg.a .mb{background:var(--card2);border:1px solid var(--border2)}
.mb h2{font-size:15px;color:var(--text);margin:8px 0 4px}
.mb h3{font-size:13px;color:var(--text);margin:6px 0 3px}
.mb strong{color:var(--text)}
.mb code{background:var(--card);padding:1px 5px;border-radius:4px;font-size:12px;color:var(--blue);font-family:monospace}
.mb pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:6px 0;overflow-x:auto}
.mb pre code{background:none;padding:0;color:var(--text2);font-size:11px;line-height:1.5;display:block}
.mb .cp{float:right;margin-top:-32px;margin-right:4px;padding:2px 8px;border-radius:4px;background:var(--card);border:1px solid var(--border);font-size:9px;color:var(--muted);cursor:pointer;z-index:1}
.mb ul{padding-left:18px;margin:4px 0}
.mb li{margin:2px 0}
.wc{text-align:center;padding:40px 20px}
.wi{width:64px;height:64px;margin:0 auto 14px;background:linear-gradient(135deg,var(--blue),#58a6ff);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px}
.wt{font-size:24px;font-weight:900;color:var(--text);margin-bottom:4px}
.ws{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5}
.wg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;max-width:480px;margin:0 auto}
.gc{padding:10px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;transition:all .2s;font-size:12px;color:var(--muted)}
.gc:hover{border-color:var(--primary);background:var(--primary-l);color:var(--text)}
.ia{border-top:1px solid var(--border);padding:8px 14px 12px;background:var(--bg2);flex-shrink:0}
.iw{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:4px;transition:border-color .2s}
.iw:focus-within{border-color:var(--primary)}
.iw textarea{flex:1;border:none;background:transparent;padding:8px 10px;color:var(--text);font-size:14px;line-height:1.4;resize:none;outline:none;max-height:120px;min-height:24px}
.iw textarea::placeholder{color:var(--muted2)}
.iw button{width:36px;height:36px;border:none;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all .2s}
.iw button:hover{background:var(--primary-d)}
.iw button:disabled{opacity:.4;cursor:default}
.ty{display:flex;gap:4px;align-items:center;padding:4px 0}
.ty span{width:6px;height:6px;border-radius:50%;background:var(--muted2);animation:tp 1.2s infinite}
.ty span:nth-child(2){animation-delay:.2s}
.ty span:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}
.ts{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:12px;color:var(--text);z-index:200;animation:ti .25s ease;pointer-events:none}
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none}.ov.on{display:block}
@media(max-width:768px){.sb{position:fixed;inset:0;right:auto;z-index:100;transform:translateX(-100%)}.sb.open{transform:translateX(0)}.ov.on{display:block}.mb{max-width:92%;font-size:13px}.av{width:28px;height:28px;font-size:10px}}
</style>
</head>
<body>
<div class="app"><div class="sb" id="sb">
<div class="sb-h"><div class="sb-i">E</div><div class="sb-t">ENRIQUE GPT</div></div>
<div class="acts">
<button class="btn" onclick="nw()"><span style="font-size:14px">+</span> New Chat</button>
<button class="btn" onclick="cl()"><span style="font-size:14px">x</span> Clear</button>
</div>
<div class="sec"><div class="sl">AI Engine</div>
<div class="st" id="aiStatus"><em>Status:</em> Loading WebLLM...<br><em>Model:</em> Qwen2.5-1.5B<br><span style="font-size:9px;color:var(--muted2)">Downloading ~1GB on first load</span></div>
<div class="btn" id="loadBtn" onclick="loadModel()" style="display:none">Load AI Model</div>
<div style="margin-top:6px;height:4px;background:var(--card2);border-radius:2px;overflow:hidden"><div id="progBar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--primary));border-radius:2px;transition:width .3s"></div></div>
<div id="progText" style="font-size:8px;color:var(--muted2);margin-top:2px;text-align:center"></div>
</div>
<div class="sec"><div class="sl">Stats</div>
<div class="st"><em>Tokens:</em> <span id="tc">0</span><br><em>Messages:</em> <span id="mc">0</span></div></div>
<div class="sf">ENRIQUE GPT • Powered by WebLLM</div></div>
<div class="mn">
<div class="top"><button class="mu" onclick="tsb()">=</button>
<div class="br"><span>ENRIQUE GPT</span><span class="ta" id="modeTag">LOCAL AI</span></div>
<div class="tk">⚡ <span id="td">0</span></div></div>
<div class="ms" id="ms"><div class="mi" id="mi"></div></div>
<div class="ia"><div class="iw">
<textarea id="inp" rows="1" placeholder="Ask me anything..."></textarea>
<button id="snd" onclick="sd()">></button>
</div></div></div></div>
<div class="ov" id="ov" onclick="tsb()"></div>

<script type="importmap">
{
  "imports": {
    "@mlc-ai/web-llm": "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.73/+esm"
  }
}
</script>
<script type="module">
// ===== ENRIQUE GPT - Powered by WebLLM =====
import { CreateMLCEngine } from "@mlc-ai/web-llm";

var D = [], T = 0, B = false, ENGINE = null, ENGINE_LOADING = false;
var MODEL_ID = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";

// ===== WebLLM Engine =====
async function loadModel() {
  if (ENGINE || ENGINE_LOADING) return;
  ENGINE_LOADING = true;
  document.getElementById('loadBtn').style.display = 'none';
  document.getElementById('progText').textContent = 'Loading model... (this may take a few minutes on first load)';
  
  try {
    document.getElementById('aiStatus').innerHTML = '<em>Status:</em> Downloading model...<br><em>Model:</em> Qwen2.5-1.5B<br><span style="font-size:9px;color:var(--muted2)">First load downloads ~1GB</span>';
    
    ENGINE = await CreateMLCEngine(MODEL_ID, {
      initProgressCallback: function(progress) {
        var pct = Math.round(progress.progress * 100);
        document.getElementById('progBar').style.width = pct + '%';
        document.getElementById('progText').textContent = progress.text || 'Loading ' + pct + '%';
        if (pct >= 100) {
          document.getElementById('progText').textContent = 'Model ready!';
          document.getElementById('aiStatus').innerHTML = '<em>Status:</em> <span style="color:var(--primary)">Running locally</span><br><em>Model:</em> Qwen2.5-1.5B<br><span style="font-size:9px;color:var(--muted2)">Running in browser via WebGPU</span>';
        }
      }
    });
    
    document.getElementById('progBar').style.width = '100%';
    document.getElementById('progText').textContent = 'AI Ready!';
    document.getElementById('aiStatus').innerHTML = '<em>Status:</em> <span style="color:var(--primary)">Running locally</span><br><em>Model:</em> Qwen2.5-1.5B<br><span style="font-size:9px;color:var(--muted2)">Running in browser via WebGPU</span>';
    document.getElementById('modeTag').textContent = 'LOCAL AI';
    ts('AI model loaded! You can now chat.');
  } catch(e) {
    document.getElementById('progText').textContent = 'Error: ' + e.message;
    document.getElementById('aiStatus').innerHTML = '<em>Status:</em> <span style="color:var(--red)">Failed to load</span><br><span style="font-size:9px;color:var(--muted2)">Using fallback engine</span>';
    document.getElementById('loadBtn').style.display = 'block';
    document.getElementById('loadBtn').textContent = 'Retry Load Model';
  }
  ENGINE_LOADING = false;
}

async function askAI(msg) {
  // If WebLLM is loaded, use it
  if (ENGINE) {
    try {
      var msgs = [
        { role: "system", content: "You are ENRIQUE GPT, a helpful AI assistant running in the browser via WebLLM. You can write code, create websites, explain concepts, and answer questions. Be concise but thorough. Support Chinese and English." }
      ];
      // Add recent conversation context
      var ctx = D.slice(-6);
      for (var i = 0; i < ctx.length; i++) {
        msgs.push({ role: ctx[i].r === 'u' ? 'user' : 'assistant', content: ctx[i].c });
      }
      msgs.push({ role: "user", content: msg });
      
      var reply = await ENGINE.chat.completions.create({
        messages: msgs,
        max_tokens: 1024,
        temperature: 0.7,
        top_p: 0.95
      });
      
      return reply.choices[0].message.content;
    } catch(e) {
      console.error('WebLLM error:', e);
      return fallbackResponse(msg);
    }
  }
  return fallbackResponse(msg);
}

// ===== Fallback Engine (when WebLLM not loaded) =====
function fallbackResponse(msg) {
  var m = msg.toLowerCase().trim();
  var cn = /[\u4e00-\u9fff]/.test(msg);
  
  function pk(a){return a[Math.random()*a.length|0]}
  
  if (/^(hi|hello|hey|你好|您好|嗨|哈[喽罗]|喂|早上好|晚上好|下午好)$/.test(m)) {
    return cn ? pk(['你好！我是 ENRIQUE GPT！请先在侧边栏加载 AI 模型，我就能用真正的 AI 回答你！','嗨！加载模型后我能回答任何问题！']) : pk(['Hello! I\'m ENRIQUE GPT! Load the AI model in the sidebar for real AI responses!','Hi! After loading the model I can answer anything!']);
  }
  if (/python/.test(m)) return cn?'Python 是一种高级编程语言。加载 AI 模型后我可以生成代码示例！':'Python is a high-level language. Load the AI model and I can generate code examples!';
  if (/(create|make|build).*(website|site|web|网站)/.test(m)) return cn?'我可以帮你创建网站！不过需要先加载 AI 模型才能生成完整的代码。请点击侧边栏的"Load AI Model"。':'I can help create websites! Please load the AI model first for complete code generation.';
  
  return cn ? '请先在侧边栏点击 "Load AI Model" 加载真正的 AI！加载后我可以回答任何问题、写代码、做网站。' : 'Please click "Load AI Model" in the sidebar first! After loading, I can answer anything, write code, and create websites.';
}

// ===== UI =====
function sd(){
  var inp = document.getElementById('inp'), msg = inp.value.trim();
  if (!msg || B) return; B = true;
  document.getElementById('snd').disabled = true;
  
  var w = document.getElementById('welc'); if (w) w.remove();
  var mi = document.getElementById('mi');
  
  var u = document.createElement('div'); u.className = 'msg u';
  u.innerHTML = '<div class="av">U</div><div class="mb">' + esc(msg) + '</div>';
  mi.appendChild(u); D.push({r:'u', c:msg, t:Date.now()}); sv();
  
  var a = document.createElement('div'); a.className = 'msg a';
  a.innerHTML = '<div class="av">E</div><div class="mb"><div class="ty"><span></span><span></span><span></span></div></div>';
  mi.appendChild(a); var bubble = a.querySelector('.mb');
  document.getElementById('ms').scrollTop = document.getElementById('ms').scrollHeight;
  inp.value = ''; ah(inp);
  
  setTimeout(async function(){
    try {
      var reply = await askAI(msg);
      var html = fmt(reply);
      bubble.innerHTML = html;
      bubble.querySelectorAll('pre').forEach(function(pre){
        var cb = document.createElement('span'); cb.className = 'cp'; cb.textContent = 'Copy';
        cb.onclick = function(){
          try { navigator.clipboard.writeText(pre.textContent).then(function(){ cb.textContent = 'Copied!'; setTimeout(function(){ cb.textContent = 'Copy'; }, 1500); }); } catch(e) {}
        };
        pre.after(cb);
      });
      D.push({r:'a', c:reply, t:Date.now()}); T += msg.length + reply.length; sv(); us();
      document.getElementById('ms').scrollTop = document.getElementById('ms').scrollHeight;
    } catch(e) {
      bubble.innerHTML = '<span style="color:var(--red)">Error: ' + esc(e.message) + '</span>';
    }
    B = false; document.getElementById('snd').disabled = false; inp.focus();
  }, 200);
}

function qa(t){document.getElementById('inp').value = t; sd();}
function nw(){D=[];T=0;sv();rd();if(window.innerWidth<769)tsb();ts('New chat');}
function cl(){if(!D.length)return;D=[];T=0;sv();rd();ts('Cleared');}
function fmt(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w+)?\n([\s\S]*?)```/g, function(m,l,c){return '<pre><code>'+c.trim()+'</code></pre>'})
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^\d+\.\s(.+)$/gm,'<li>$1</li>').replace(/^[•\-]\s(.+)$/gm,'<li>$1</li>')
    .replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');
}
function esc(s){if(typeof s!='string')s=String(s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ah(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}
function rd(){
  var mi=document.getElementById('mi'); mi.innerHTML = '';
  if (!D.length) {
    mi.innerHTML = '<div class="wc" id="welc"><div class="wi">E</div><div class="wt">ENRIQUE GPT</div><div class="ws">Real AI running in your browser via WebLLM<br>Load the model once for GPT-level intelligence</div><div class="wg">'+
      '<div class="gc" onclick="qa(\'Hello\')">👋 Hello</div>'+
      '<div class="gc" onclick="qa(\'Write Python code\')">🐍 Python</div>'+
      '<div class="gc" onclick="qa(\'Create a website\')">🌐 Website</div>'+
      '<div class="gc" onclick="qa(\'Explain AI\')">🧠 Explain AI</div>'+
      '<div class="gc" onclick="qa(\'Tell me a joke\')">😄 Joke</div>'+
      '<div class="gc" onclick="qa(\'Help me study\')">📚 Study</div>'+
    '</div><div style="margin-top:16px;font-size:11px;color:var(--muted2);line-height:1.5">⚠️ First time? Click "Load AI Model" in the sidebar<br>Downloads ~1GB model (one-time), then runs 100% offline</div></div>';
    return;
  }
  D.forEach(function(m){
    var d = document.createElement('div'); d.className = 'msg ' + (m.r == 'u' ? 'u' : 'a');
    var av = m.r == 'u' ? 'U' : 'E', txt = esc(m.c || '');
    if (m.r == 'a') txt = fmt(m.c);
    d.innerHTML = '<div class="av">'+av+'</div><div class="mb">'+txt+'</div>'; mi.appendChild(d);
  });
  document.getElementById('ms').scrollTop = document.getElementById('ms').scrollHeight;
}
function us(){document.getElementById('tc').innerHTML = T; document.getElementById('td').innerHTML = T; document.getElementById('mc').innerHTML = D.length}
function tsb(){document.getElementById('sb').classList.toggle('open'); document.getElementById('ov').classList.toggle('on')}
function ts(m){var t=document.createElement('div');t.className='ts';t.textContent=' '+m;document.body.appendChild(t);setTimeout(function(){t.remove()},2000)}
function sv(){try{localStorage.setItem('eg',JSON.stringify({d:D,t:T}))}catch(e){}}
(function(){
  try{var d=localStorage.getItem('eg');if(d){var p=JSON.parse(d);D=p.d||[];T=p.t||0}}catch(e){}
  us(); rd();
  var inp = document.getElementById('inp');
  inp.addEventListener('input', function(){ah(this)});
  inp.addEventListener('keydown', function(e){if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();sd()}});
  // Show load button if no engine
  setTimeout(function(){
    if(!ENGINE) {
      document.getElementById('loadBtn').style.display = 'block';
    }
  }, 1000);
  console.log('ENRIQUE GPT loaded');
})();
</script>
</body></html>
