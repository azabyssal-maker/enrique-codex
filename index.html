*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button,input,textarea{font-family:inherit}

.sb-title{font-size:15px;font-weight:800;flex:1}

<script>
/* ===== ENRIQUE AI - Pure JavaScript Neural Network ===== */
var VERSION = '9.0';
var POWER = {min:200, low:500, med:1500, high:3000, max:4000};
var CUR = 'med';
var DATA = [];
var TOKENS = 0;
var BUSY = false;

// Load saved data
try{
  var d = localStorage.getItem('ea7_data');
  if(d){ var p = JSON.parse(d); DATA = p.d||[]; TOKENS = p.t||0; CUR = p.c||'med'; }
}catch(e){}

function $(id){return document.getElementById(id)}

function save(){
  localStorage.setItem('ea7_data', JSON.stringify({d:DATA, t:TOKENS, c:CUR}));
  updateUI();
}

function esc(s){
  if(!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function toast(msg, t){
  var el = document.createElement('div');
  el.className = 'toast ' + (t||'');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove() }, 2500);
}

function autoResize(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,120)+"px"}

function updateUI(){
  document.getElementById('tokenDisplay').textContent = TOKENS > 0 ? TOKENS.toLocaleString() + ' tok' : '0';
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('on');
}

function newChat(){
  DATA = [];
  TOKENS = 0;
  save();
  render();
  if(window.innerWidth<769) toggleSidebar();
  toast('New chat created','ok');
}

function clearChat(){
  if(!DATA.length) return;
  DATA = [];
  TOKENS = 0;
  save();
  render();
  toast('Cleared','ok');
}

function ask(q){
  $('inp').value = q;
  send();
}


// ===== BRAIN (Rule-based Fallback) =====
var BRAIN = {
  facts: {},
  convos: [],
  rem: function(k,v){this.facts[k]={v:v,t:Date.now()}},
  rec: function(k){ return this.facts[k] ? this.facts[k].v : null; },
  add: function(u,a){this.convos.push({u:u,a:a,t:Date.now()});if(this.convos.length>30)this.convos=this.convos.slice(-30);},
  process: function(msg, power){
    var m = msg.toLowerCase().trim();
    if(/^(hi|hello|hey|你好|嗨)/.test(m)) return 'Hello! I\'m ENRIQUE AI. I\'m still learning - the more you talk to me, the smarter I get! 🧠 Train me by clicking "Train ENRIQUE" in the sidebar.';
    if(/你是谁|who are you/.test(m)) return 'I\'m ENRIQUE AI - a neural network created from scratch in JavaScript! No libraries, no APIs, no pre-trained models. Just pure math and code. Every conversation makes me smarter.';
    if(/what can you do|help|功能/.test(m)) return 'I can learn from our conversations! Just chat with me. Click "Train ENRIQUE" in the sidebar to train my neural network. I can talk in Chinese or English. The more you talk, the better I get!';
    if(/joke|笑话/.test(m)){var j=['Why did the neural network cross the road? To get to the other layer!','What do you call a AI that sings? A neur-harmonic network!','I\'m still learning jokes. Ask me again after I\'m trained!'];return j[Math.floor(Math.random()*j.length)];}
    if(/create|make|build|写|做|创建/.test(m)){
      if(/website|site|web|网页/.test(m)) return 'I can learn to create websites! For now, here\'s what I know:\n\n```html\n<!DOCTYPE html><html><body><h1>Hello World</h1><p>Train me to make better sites!</p></body></html>\n```\nTell me more and train my neural network!';
      if(/python|script/.test(m)) return '```python\nprint("Hello from ENRIQUE AI!")\n# Train me to write better code!\n```';
      return 'I\'m learning to code! Keep chatting and training me to get better.';
    }
    return 'Interesting! I\'m still learning to understand. Keep talking to me and click "Train ENRIQUE" - every conversation helps me learn! 🧠';
  }
};

// ===== Neural Network Code =====
// ===== ENRIQUE Neural Network - From Scratch =====
// No libraries, no APIs, no pre-trained models.
// A character-level RNN that learns from conversations.

class Matrix {
  constructor(rows, cols, vals) {
    this.rows = rows;
    this.cols = cols;
    this.data = new Float32Array(rows * cols);
    if (vals) {
      for (let i = 0; i < rows * cols; i++) this.data[i] = vals[i] || 0;
    } else {
      // Xavier initialization
      const scale = Math.sqrt(2.0 / (rows + cols));
      for (let i = 0; i < rows * cols; i++) {
        this.data[i] = (Math.random() * 2 - 1) * scale;
      }
    }
  }
  
  get(r, c) { return this.data[r * this.cols + c]; }
  set(r, c, v) { this.data[r * this.cols + c] = v; }
  
  // Matrix multiply: this * other
  mul(other) {
    if (this.cols !== other.rows) throw Error(`mul dims: ${this.rows}x${this.cols} * ${other.rows}x${other.cols}`);
    const out = new Matrix(this.rows, other.cols);
    for (let i = 0; i < this.rows; i++) {
      for (let j = 0; j < other.cols; j++) {
        let sum = 0;
        for (let k = 0; k < this.cols; k++) {
          sum += this.get(i, k) * other.get(k, j);
        }
        out.set(i, j, sum);
      }
    }
    return out;
  }
  
  // Add another matrix or scalar
  add(other) {
    if (typeof other === 'number') {
      const out = new Matrix(this.rows, this.cols);
      for (let i = 0; i < this.rows * this.cols; i++) out.data[i] = this.data[i] + other;
      return out;
    }
    if (this.rows !== other.rows || this.cols !== other.cols) throw Error('add dims');
    const out = new Matrix(this.rows, this.cols);
    for (let i = 0; i < this.rows * this.cols; i++) out.data[i] = this.data[i] + other.data[i];
    return out;
  }
  
  // Element-wise multiply
  elmul(other) {
    const out = new Matrix(this.rows, this.cols);
    for (let i = 0; i < this.rows * this.cols; i++) out.data[i] = this.data[i] * other.data[i];
    return out;
  }
  
  // Apply function element-wise
  map(fn) {
    const out = new Matrix(this.rows, this.cols);
    for (let i = 0; i < this.rows * this.cols; i++) out.data[i] = fn(this.data[i]);
    return out;
  }
  
  // Transpose
  T() {
    const out = new Matrix(this.cols, this.rows);
    for (let i = 0; i < this.rows; i++) {
      for (let j = 0; j < this.cols; j++) {
        out.set(j, i, this.get(i, j));
      }
    }
    return out;
  }
  
  // Copy
  copy() {
    const out = new Matrix(this.rows, this.cols);
    out.data = new Float32Array(this.data);
    return out;
  }
  
  // Scale by scalar
  scale(s) {
    const out = new Matrix(this.rows, this.cols);
    for (let i = 0; i < this.rows * this.cols; i++) out.data[i] = this.data[i] * s;
    return out;
  }
}

// ===== Activation Functions =====
function tanh(x) { return Math.tanh(x); }
function dtanh(y) { return 1 - y * y; }
function sigmoid(x) { return 1 / (1 + Math.exp(-Math.max(-50, Math.min(50, x)))); }
function dsigmoid(y) { return y * (1 - y); }
function softmax(x) {
  const max = Math.max(...x);
  const exps = x.map(v => Math.exp(v - max));
  const sum = exps.reduce((a, b) => a + b, 0);
  return exps.map(v => v / sum);
}

// ===== ENRIQUE RNN =====
class ENRIQUERNN {
  constructor(vocabSize, hiddenSize = 128, embedSize = 32) {
    this.vs = vocabSize;
    this.hs = hiddenSize;
    this.es = embedSize;
    
    // Embedding
    this.Wex = new Matrix(vocabSize, embedSize);  // vocab -> embed
    
    // RNN weights
    this.Wxh = new Matrix(embedSize, hiddenSize);  // input -> hidden
    this.Whh = new Matrix(hiddenSize, hiddenSize); // hidden -> hidden
    this.bh = new Matrix(1, hiddenSize);           // hidden bias
    
    // Output weights
    this.Why = new Matrix(hiddenSize, vocabSize);  // hidden -> output
    this.by = new Matrix(1, vocabSize);            // output bias
    
    this.iter = 0;
    this.smoothLoss = 0;
  }
  
  // Forward pass for one step
  stepForward(ix, hprev) {
    // ix: input character index, hprev: previous hidden state
    const x = new Matrix(1, this.es);
    for (let j = 0; j < this.es; j++) {
      x.set(0, j, this.Wex.get(ix, j));
    }
    
    // h = tanh(x * Wxh + hprev * Whh + bh)
    const xWxh = x.mul(this.Wxh);
    const hWhh = hprev.mul(this.Whh);
    const hRaw = xWxh.add(hWhh).add(this.bh);
    const h = hRaw.map(tanh);
    
    // y = h * Why + by -> softmax
    const yRaw = h.mul(this.Why).add(this.by);
    const yProbs = softmax([...yRaw.data]);
    
    return { h, yProbs, x, hRaw };
  }
  
  // Sample a character from probability distribution
  sample(yProbs, temperature = 0.8) {
    // Apply temperature
    const scaled = yProbs.map(p => Math.pow(p, 1/temperature));
    const sum = scaled.reduce((a, b) => a + b, 0);
    const normed = scaled.map(p => p / sum);
    
    // Sample
    let r = Math.random();
    for (let i = 0; i < normed.length; i++) {
      r -= normed[i];
      if (r <= 0) return i;
    }
    return normed.length - 1;
  }
  
  // Generate text
  generate(chars, charToIdx, seed, length = 200, temperature = 0.7) {
    let h = new Matrix(1, this.hs);
    let out = seed || '';
    
    // Prime with seed
    for (let ch of seed || '') {
      const ix = charToIdx[ch] !== undefined ? charToIdx[ch] : 0;
      const fwd = this.stepForward(ix, h);
      h = fwd.h;
    }
    
    // Generate
    for (let i = 0; i < length; i++) {
      const lastChar = out[out.length - 1] || ' ';
      const ix = charToIdx[lastChar] !== undefined ? charToIdx[lastChar] : 0;
      const fwd = this.stepForward(ix, h);
      h = fwd.h;
      const nextIx = this.sample(fwd.yProbs, temperature);
      out += chars[nextIx] || '?';
    }
    
    return out;
  }
  
  // Train on a sequence (BPTT)
  train(seq, charToIdx, lr = 0.01) {
    if (seq.length < 2) return;
    
    const seqIndices = [];
    for (let ch of seq) {
      seqIndices.push(charToIdx[ch] !== undefined ? charToIdx[ch] : 0);
    }
    
    // Forward pass: store all states
    const states = [];
    let h = new Matrix(1, this.hs);
    
    for (let t = 0; t < seqIndices.length - 1; t++) {
      const fwd = this.stepForward(seqIndices[t], h);
      states.push({ ...fwd, h_prev: h.copy(), ix: seqIndices[t], target: seqIndices[t + 1] });
      h = fwd.h;
    }
    
    // Loss
    let loss = 0;
    for (let t = 0; t < states.length; t++) {
      loss += -Math.log(Math.max(states[t].yProbs[states[t].target], 1e-8));
    }
    this.smoothLoss = this.smoothLoss * 0.999 + loss / states.length * 0.001;
    
    // Backward pass
    const dWxh = new Matrix(this.es, this.hs);
    const dWhh = new Matrix(this.hs, this.hs);
    const dbh = new Matrix(1, this.hs);
    const dWhy = new Matrix(this.hs, this.vs);
    const dby = new Matrix(1, this.vs);
    const dWex = new Matrix(this.vs, this.es);
    
    let dhNext = new Matrix(1, this.hs);
    
    for (let t = states.length - 1; t >= 0; t--) {
      const st = states[t];
      
      // dy = softmax gradient
      const dy = new Matrix(1, this.vs);
      for (let i = 0; i < this.vs; i++) {
        dy.set(0, i, st.yProbs[i]);
      }
      dy.set(0, st.target, dy.get(0, st.target) - 1);
      
      // dWhy += h.T * dy
      const hT = st.h.T();
      const dWhy_part = hT.mul(dy);
      for (let i = 0; i < this.hs * this.vs; i++) dWhy.data[i] += dWhy_part.data[i];
      
      // dby += dy
      for (let i = 0; i < this.vs; i++) dby.data[i] += dy.data[i];
      
      // dh = dy * Why.T + dhNext
      const dhRaw = dy.mul(this.Why.T()).add(dhNext);
      
      // dh_mod = dh * dtanh(h_raw)
      const dhMod = dhRaw.elmul(st.hRaw.map(v => dtanh(tanh(v))));
      
      // dWxh += x.T * dhMod
      const xT = st.x.T();
      const dWxh_part = xT.mul(dhMod);
      for (let i = 0; i < this.es * this.hs; i++) dWxh.data[i] += dWxh_part.data[i];
      
      // dWhh += h_prev.T * dhMod
      const hpT = st.h_prev.T();
      const dWhh_part = hpT.mul(dhMod);
      for (let i = 0; i < this.hs * this.hs; i++) dWhh.data[i] += dWhh_part.data[i];
      
      // dbh += dhMod
      for (let i = 0; i < this.hs; i++) dbh.data[i] += dhMod.data[i];
      
      // dhNext = dhMod * Whh.T
      dhNext = dhMod.mul(this.Whh.T());
      
      // dWex for embedding
      for (let j = 0; j < this.es; j++) {
        dWex.data[st.ix * this.es + j] += dhMod.data[j];
      }
    }
    
    // Clip gradients
    const clip = (v, max) => Math.max(-max, Math.min(max, v));
    
    // Update weights
    const update = (W, dW) => {
      for (let i = 0; i < W.rows * W.cols; i++) {
        W.data[i] -= lr * clip(dW.data[i], 5);
      }
    };
    
    update(this.Wxh, dWxh);
    update(this.Whh, dWhh);
    update(this.bh, dbh);
    update(this.Why, dWhy);
    update(this.by, dby);
    update(this.Wex, dWex);
    
    this.iter++;
  }
  
  // Save weights to JSON
  save() {
    const toArr = (m) => Array.from(m.data);
    return {
      vs: this.vs, hs: this.hs, es: this.es,
      Wex: toArr(this.Wex), Wxh: toArr(this.Wxh),
      Whh: toArr(this.Whh), bh: toArr(this.bh),
      Why: toArr(this.Why), by: toArr(this.by),
      iter: this.iter, smoothLoss: this.smoothLoss
    };
  }
  
  // Load weights from JSON
  load(data) {
    const fromArr = (m, arr) => { m.data = new Float32Array(arr); };
    this.vs = data.vs; this.hs = data.hs; this.es = data.es;
    fromArr(this.Wex, data.Wex);
    fromArr(this.Wxh, data.Wxh);
    fromArr(this.Whh, data.Whh);
    fromArr(this.bh, data.bh);
    fromArr(this.Why, data.Why);
    fromArr(this.by, data.by);
    this.iter = data.iter || 0;
    this.smoothLoss = data.smoothLoss || 0;
  }
}

// ===== ENRIQUE Brain =====
// Build vocabulary from conversation data
function buildVocab(texts) {
  const chars = new Set();
  for (let t of texts) {
    for (let ch of t) chars.add(ch);
  }
  const sorted = Array.from(chars).sort();
  const charToIdx = {};
  const idxToChar = {};
  sorted.forEach((ch, i) => { charToIdx[ch] = i; idxToChar[i] = ch; });
  return { chars: sorted, charToIdx, idxToChar, size: sorted.length };
}

// Default vocabulary (common Chinese + English chars)
function defaultVocab() {
  const chars = ' abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,!?;:\'"-()[]{}@#$%^&*+=/\\|~`<> \n\t的一是不了人我在有他这中大来上国个到说们为和地出要时看没只如开会可对生年发成部民能方进同经法面又分前平定后然间因长期把多公从里事好她些还其动两动手已外小高点长当都水化得自她什但者于些又她'
  const unique = Array.from(new Set(chars)).sort();
  const charToIdx = {};
  const idxToChar = {};
  unique.forEach((ch, i) => { charToIdx[ch] = i; idxToChar[i] = ch; });
  return { chars: unique, charToIdx, idxToChar, size: unique.length };
}

console.log('ENRIQUE Neural Network module loaded');


// ===== NN Integration =====
var ENRIQUE_NN = null;
var NN_VOCAB = defaultVocab();
var NN_TRAINED = false;
var NN_CONVO = JSON.parse(localStorage.getItem('ea_nn_convo')||'[]');

// Try to load saved weights
try {
  var saved = localStorage.getItem('ea_nn_weights');
  if(saved) {
    var data = JSON.parse(saved);
    ENRIQUE_NN = new ENRIQUERNN(data.vs, data.hs, data.es);
    ENRIQUE_NN.load(data);
    NN_TRAINED = true;
    NN_VOCAB = {chars: [], charToIdx: {}, idxToChar: {}, size: data.vs};
  }
} catch(e) {}

if(!ENRIQUE_NN) {
  ENRIQUE_NN = new ENRIQUERNN(NN_VOCAB.size, 128, 32);
}

updateNNStatus();

function updateNNStatus() {
  var s = document.getElementById('nnStatus');
  var i = document.getElementById('nnInfo');
  if(!s || !i) return;
  if(NN_TRAINED) {
    s.textContent = '✅ Trained (' + ENRIQUE_NN.iter + ' iters)';
    i.textContent = 'Loss: ' + ENRIQUE_NN.smoothLoss.toFixed(4) + ' · Vocab: ' + ENRIQUE_NN.vs + ' chars';
  } else {
    s.textContent = '⚪ Fresh network';
    i.textContent = 'Params: ~' + (ENRIQUE_NN.vs * 32 + 32*128 + 128*128 + 128*ENRIQUE_NN.vs + ENRIQUE_NN.vs) + ' · Chat to train!';
  }
}

function trainNN() {
  var status = document.getElementById('nnStatus');
  var progress = document.getElementById('trainProgress');
  var fill = document.getElementById('trainFill');
  var text = document.getElementById('trainText');
  if(!progress) return;
  
  progress.style.display = 'block';
  if(status) status.textContent = '⏳ Training...';
  
  setTimeout(function() {
    var allText = NN_CONVO.map(function(m){ return m.c; }).join(' ');
    if(allText.length < 10) {
      allText = 'Hello! I am ENRIQUE AI. I learn from conversations. I can write code. 你好！我是从零创建的 AI。我可以学习。';
    }
    
    var vocab = buildVocab([allText].concat(NN_CONVO.map(function(m){return m.c})));
    ENRIQUE_NN = new ENRIQUERNN(vocab.size, 128, 32);
    NN_VOCAB = vocab;
    
    var totalEpochs = Math.min(50, Math.max(5, Math.floor(allText.length / 10)));
    for(var epoch = 0; epoch < totalEpochs; epoch++) {
      ENRIQUE_NN.train(allText, vocab.charToIdx, 0.01);
      var pct = Math.round((epoch + 1) / totalEpochs * 100);
      if(fill) fill.style.width = pct + '%';
      if(text) text.textContent = 'Epoch ' + (epoch+1) + '/' + totalEpochs;
    }
    
    NN_TRAINED = true;
    if(progress) progress.style.display = 'none';
    if(status) status.textContent = '✅ Trained! (' + ENRIQUE_NN.iter + ' iters)';
    
    localStorage.setItem('ea_nn_weights', JSON.stringify(ENRIQUE_NN.save()));
    toast('🧠 ENRIQUE NN trained!');
    updateNNStatus();
  }, 100);
}

function nnRespond(msg) {
  if(!ENRIQUE_NN || !NN_TRAINED) return null;
  
  var response = ENRIQUE_NN.generate(NN_VOCAB.chars, NN_VOCAB.charToIdx, msg, 200, 0.7);
  response = response.substring(msg.length).trim();
  if(response.length > 300) response = response.substring(0, 300);
  var stopIdx = response.lastIndexOf('。');
  if(stopIdx > 20) response = response.substring(0, stopIdx + 1);
  stopIdx = response.lastIndexOf('.');
  if(stopIdx > 20 && stopIdx > response.lastIndexOf('。')) response = response.substring(0, stopIdx + 1);
  return response || '';
}

function learnFromConvo(msg, reply) {
  if(!ENRIQUE_NN) return;
  NN_CONVO.push({r:'u', c:msg, t:Date.now()});
  NN_CONVO.push({r:'a', c:reply, t:Date.now()});
  if(NN_CONVO.length > 50) NN_CONVO = NN_CONVO.slice(-50);
  localStorage.setItem('ea_nn_convo', JSON.stringify(NN_CONVO));
  
  setTimeout(function() {
    ENRIQUE_NN.train(msg + ' ' + reply, NN_VOCAB.charToIdx, 0.005);
    if(ENRIQUE_NN.iter % 5 === 0) {
      localStorage.setItem('ea_nn_weights', JSON.stringify(ENRIQUE_NN.save()));
      updateNNStatus();
    }
  }, 500);
}

// ===== SEND =====
function send(){
  var inp = $('inp');
  var msg = inp.value.trim();
  if(!msg || BUSY) return;
  BUSY = true;
  $('sendBtn').disabled = true;

  var w = $('welcome');
  if(w) w.remove();

  var inner = $('msgsInner');

  // User message
  var u = document.createElement('div');
  u.className = 'msg u';
  u.innerHTML = '<div class="msg-av">U</div><div class="msg-b">'+esc(msg)+'</div>';
  inner.appendChild(u);
  DATA.push({r:'u',c:msg,t:Date.now()});
  save();

  // AI response
  var a = document.createElement('div');
  a.className = 'msg a';
  a.innerHTML = '<div class="msg-av">E</div><div class="msg-b"><div class="typing"><span></span><span></span><span></span></div></div>';
  inner.appendChild(a);
  var bubble = a.querySelector('.msg-b');
  $('msgs').scrollTop = $('msgs').scrollHeight;
  inp.value = '';

  setTimeout(function(){
    var reply = '';
    
    if(NN_TRAINED && ENRIQUE_NN) {
      // Use neural network
      reply = nnRespond(msg);
      if(!reply) reply = BRAIN.process(msg, CUR);
    } else {
      // Use rule-based fallback
      reply = BRAIN.process(msg, CUR);
    }
    
    try {
      var html = reply
        .replace(/### (.+)/g, '<h3>$1</h3>')
        .replace(/## (.+)/g, '<h2>$1</h2>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\`\`\`(\w+)?\n([\s\S]*?)\`\`\`/g, '<pre><code>$2</code></pre>')
        .replace(/\`([^\`]+)\`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>')
        .replace(/- (.+)/g, function(m,p){return '• '+p+'<br>'});

      bubble.innerHTML = html;

      bubble.querySelectorAll('pre').forEach(function(pre){
        var b = document.createElement('span');
        b.className = 'cp-btn';
        b.textContent = '📋 Copy';
        b.onclick = function(){
          navigator.clipboard.writeText(pre.textContent);
          b.textContent = '✅ Copied';
          setTimeout(function(){b.textContent='📋 Copy'},1500);
        };
        pre.after(b);
      });

      DATA.push({r:'a',c:reply,t:Date.now()});
      TOKENS += msg.length + reply.length;
      save();
      $('msgs').scrollTop = $('msgs').scrollHeight;
      learnFromConvo(msg, reply);
    } catch(e){
      bubble.innerHTML = '<span style="color:var(--red)">Error: '+esc(e.message)+'</span>';
    }
    BUSY = false;
    $('sendBtn').disabled = false;
    inp.focus();
  }, 200);
}

// ===== RENDER =====
function render(){
  var inner = $('msgsInner');
  inner.innerHTML = '';

  if(!DATA.length){
    inner.innerHTML = '<div class="welcome" id="welcome"><div class="wlc-icon">⚡</div><div class="wlc-title">ENRIQUE AI</div><div class="wlc-sub">A neural network built from scratch<br>Talk to train it!</div><div class="wlc-chips"><div class="wlc-chip" onclick="ask(&#39;Hello&#39;)">👋 Hello</div><div class="wlc-chip" onclick="ask(&#39;Create a website&#39;)">🌐 Website</div><div class="wlc-chip" onclick="ask(&#39;Write Python code&#39;)">🐍 Python</div><div class="wlc-chip" onclick="ask(&#39;What can you do&#39;)">💡 Help</div><div class="wlc-chip" onclick="ask(&#39;Tell me a joke&#39;)">😂 Joke</div><div class="wlc-chip" onclick="ask(&#39;你是谁&#39;)">🤔 你是谁</div></div></div>';
    return;
  }

  DATA.forEach(function(m){
    var d = document.createElement('div');
    d.className = 'msg ' + (m.r==='u'?'u':'a');
    var av = m.r==='u'?'U':'E';
    var txt = esc(typeof m.c==='string'?m.c:'');
    if(m.r==='a'){
      txt = txt.replace(/### (.+)/g,'<h3>$1</h3>').replace(/## (.+)/g,'<h2>$1</h2>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\`\`\`(\w+)?\n([\s\S]*?)\`\`\`/g,'<pre><code>$2</code></pre>').replace(/\`([^\`]+)\`/g,'<code>$1</code>').replace(/\n/g,'<br>').replace(/- (.+)/g,function(m,p){return '• '+p+'<br>'});
    }
    d.innerHTML = '<div class="msg-av">'+av+'</div><div class="msg-b">'+txt+'</div>';
    inner.appendChild(d);
  });
  $('msgs').scrollTop = $('msgs').scrollHeight;
}

// ===== INIT =====
updateUI();
render();
