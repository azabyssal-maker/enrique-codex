<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ENRIQUE AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0f;--bg2:#111118;--card:#181825;--card2:#20202e;--border:#2a2a3a;--border2:#3a3a4e;--primary:#10a37f;--primary-l:#0d2e23;--primary-d:#0d8a6a;--green:#10b981;--red:#f85149;--orange:#d29922;--blue:#58a6ff;--text:#e4e4ec;--text2:#c8c8d4;--muted:#7d7d90;--muted2:#4a4a5e;--shadow:0 2px 8px rgba(0,0,0,.4);--shadow2:0 8px 24px rgba(0,0,0,.5);--radius:16px;--radius-sm:10px}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,system-ui,sans-serif}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
input,textarea,button{font-family:inherit}

/* Header */
.header{display:flex;align-items:center;padding:8px 14px;gap:10px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;z-index:10}
.header-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.header-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#34d399);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;flex-shrink:0}
.header-title{font-size:15px;font-weight:800;white-space:nowrap}
.header-badge{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;background:rgba(210,153,34,.15);color:var(--orange);white-space:nowrap}
.header-r{display:flex;gap:6px;flex-shrink:0}
.header-btn{width:30px;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);transition:all .15s}
.header-btn:active{transform:scale(.92)}

/* Messages */
.msgs{flex:1;overflow-y:auto;padding:16px 14px;padding-bottom:8px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.msgs-inner{max-width:680px;margin:0 auto}
.msg{margin-bottom:14px;display:flex;gap:10px;animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.u{justify-content:flex-end}
.msg-av{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.msg.a .msg-av{background:linear-gradient(135deg,var(--primary),#34d399);color:#fff}
.msg.u .msg-av{background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.msg-b{max-width:88%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.65;color:var(--text2);word-wrap:break-word}
.msg.u .msg-b{background:var(--primary);color:#fff;border-radius:14px 14px 4px 14px}
.msg.a .msg-b{background:var(--card);border:1px solid var(--border);border-radius:14px 14px 14px 4px}
.msg-b p{margin-bottom:6px}.msg-b p:last-child{margin-bottom:0}
.msg-b code{font-size:12px;font-family:'JetBrains Mono',monospace}
.msg-b :not(pre)>code{background:var(--card2);padding:2px 5px;border-radius:4px}
.msg-b pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;overflow-x:auto;margin:8px 0;font-size:12px}
.msg-b a{color:var(--blue)}
.msg-b ul,.msg-b ol{padding-left:18px;margin:4px 0}
.msg-b img{max-width:180px;border-radius:8px;margin:4px 0}

/* Welcome */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;min-height:60vh}
.wlc-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--primary),#34d399);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin-bottom:16px;box-shadow:0 6px 20px rgba(16,163,127,.25)}
.wlc-title{font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--primary),#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.wlc-sub{font-size:13px;color:var(--muted);max-width:340px;line-height:1.5;margin-bottom:20px}
.wlc-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:400px}
.wlc-chip{padding:8px 14px;border:1px solid var(--border);border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;background:var(--card);color:var(--text)}
.wlc-chip:active{transform:scale(.95);border-color:var(--primary);background:var(--primary-l)}

/* Footer input */
.footer{flex-shrink:0;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);background:var(--bg2)}
.ibar{display:flex;align-items:center;gap:8px;max-width:680px;margin:0 auto}
.ibtn{width:36px;height:36px;border:none;border-radius:8px;background:var(--card);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:all .15s}
.ibtn:active{transform:scale(.92)}
.ifield{flex:1;padding:9px 14px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:14px;outline:none;transition:all .2s;min-height:36px}
.ifield:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(16,163,127,.08)}
.ifield::placeholder{color:var(--muted2)}
.isend{width:36px;height:36px;border:none;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all .15s}
.isend:active{transform:scale(.92);background:var(--primary-d)}
.isend:disabled{opacity:.3}

/* Toast */
.toast{position:fixed;top:16px;right:16px;padding:10px 16px;border-radius:10px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow2);font-size:13px;font-weight:500;z-index:999;animation:slide .2s ease;max-width:280px}
@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.bad{border-color:var(--red);color:var(--red)}

/* History panel */
.hist-pnl{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
.hist-pnl.open{display:flex}
.hist-head{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);gap:12px}
.hist-head h3{font-size:16px;font-weight:700;flex:1}
.hist-close{width:30px;height:30px;border:none;border-radius:7px;background:var(--card);color:var(--muted);cursor:pointer;font-size:14px}
.hist-list{flex:1;overflow-y:auto;padding:8px 16px}
.hist-item{padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--card);transition:all .15s}
.hist-item:active{transform:scale(.98)}
.hist-item h4{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item p{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item .t{font-size:10px;color:var(--muted2);margin-top:4px}

@media(max-width:480px){
  .msgs{padding:12px 10px}
  .msg-b{font-size:13px;padding:9px 12px}
  .wlc-title{font-size:20px}
  .wlc-icon{width:48px;height:48px;font-size:22px}
  .header{padding:6px 10px}
  .ifield{font-size:14px;padding:8px 12px}
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="header">
    <div class="header-l">
      <div class="header-icon">E</div>
      <span class="header-title">ENRIQUE</span>
      <span class="header-badge" id="pwrBadge">MEDIUM</span>
    </div>
    <div class="header-r">
      <button class="header-btn" onclick="showHist()" title="History">📋</button>
      <button class="header-btn" onclick="clrChat()" title="Clear">🗑️</button>
    </div>
  </div>

  <div class="msgs" id="msgs">
    <div class="msgs-inner">
      <div class="welcome" id="welcome">
        <div class="wlc-icon">⚡</div>
        <div class="wlc-title">ENRIQUE AI</div>
        <div class="wlc-sub">Your AI brain. Chat, code, create. 100% local.</div>
        <div class="wlc-chips">
          <div class="wlc-chip" onclick="ask('Create a modern responsive website')">🌐 Website</div>
          <div class="wlc-chip" onclick="ask('Search latest AI news')">🔍 Search</div>
          <div class="wlc-chip" onclick="ask('Write a Python script')">🐍 Python</div>
          <div class="wlc-chip" onclick="ask('Build a calculator app')">🧮 Calc</div>
          <div class="wlc-chip" onclick="ask('Create a shop page')">🛍️ Shop</div>
          <div class="wlc-chip" onclick="ask('Build a dashboard')">📊 Dashboard</div>
          <div class="wlc-chip" onclick="ask('Tell me a joke')">😂 Joke</div>
          <div class="wlc-chip" onclick="ask('What can you do')">💡 Help</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="ibar">
      <input class="ifield" id="inp" placeholder="Type anything..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}">
      <button class="isend" id="sendBtn" onclick="send()">↑</button>
    </div>
  </div>
</div>

<div class="hist-pnl" id="histPnl">
  <div class="hist-head">
    <h3>📋 History</h3>
    <button class="hist-close" onclick="hideHist()">✕</button>
  </div>
  <div class="hist-list" id="histList"></div>
</div>

<script>
/* ===== ENRIQUE AI v7.0 ===== */
var VERSION = '7.0';
var MODEL = 'openai/gpt-3.5-turbo';
var POWER = {min:200,low:500,med:1500,high:3000,max:4000};
var CUR_POWER = 'med';
var DATA = JSON.parse(localStorage.getItem('ea_chat') || '[]');
var TOKENS = parseInt(localStorage.getItem('ea_tokens') || '0');
var BUSY = false;

function $(id){return document.getElementById(id)}

function save(){
  localStorage.setItem('ea_chat', JSON.stringify(DATA));
  localStorage.setItem('ea_tokens', String(TOKENS));
}

function esc(s){
  if(!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function toast(msg, t){
  var el = document.createElement('div');
  el.className = 'toast ' + (t||'');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove() }, 2500);
}

/* ===== ENRIQUE BRAIN ===== */
var BRAIN = {
  facts: JSON.parse(localStorage.getItem('ea_facts') || '{}'),
  convos: JSON.parse(localStorage.getItem('ea_convos') || '[]'),
  remember: function(k,v){this.facts[k]={v:v,t:Date.now()};localStorage.setItem('ea_facts',JSON.stringify(this.facts))},
  recall: function(k){
    if(this.facts[k]) return this.facts[k].v;
    for(var f in this.facts) if(f.toLowerCase().includes(k.toLowerCase())) return this.facts[f].v;
    return null;
  },
  addConvo: function(u,a){
    this.convos.push({u:u,a:a,t:Date.now()});
    if(this.convos.length>30) this.convos = this.convos.slice(-30);
    localStorage.setItem('ea_convos', JSON.stringify(this.convos));
  },
  process: function(msg){
    var m = msg.toLowerCase().trim();
    
    // Greeting
    if(/^(hi|hello|hey|你好|嗨|您好|hey|sup|yo)/.test(m)){
      var name = this.recall('name');
      var gs = ['Hey! Im ENRIQUE AI','Hello! How can I help?','Hi there!'+(name?', '+name:'')+' ⚡'];
      return gs[Math.floor(Math.random()*gs.length)];
    }
    
    // Who are you
    if(/你是谁|who are you|what are you/.test(m)){
      return 'I am **ENRIQUE AI** ⚡ — your personal AI brain. I run 100% in your browser, remember our conversations, create websites, control your device, and chat in any language.';
    }
    
    // What can you do
    if(/what can you do|help|功能|你能做什么|capabilities/.test(m)){
      return '**Here\\'s what I can do:**\\n\\n🌐 **Create** websites, apps, games, dashboards\\n🔍 **Search** the web (opens Google)\\n🐍 **Code** in JS, Python, HTML\\n💬 **Chat** in any language\\n🧠 **Remember** our conversations\\n📱 **Control** your phone (camera, GPS, etc)\\n😂 **Tell** jokes\\n🧮 **Calculate** math\\n\\nJust ask naturally!';
    }
    
    // Name
    if(/my name is |i am |im |call me /.test(m)){
      var match = m.match(/(?:my name is |i am |im |call me )(\w+)/i);
      if(match){this.remember('name',match[1]);return 'Nice to meet you, **'+match[1]+'**! Ill remember that. 😊'}
    }
    
    // Remember
    if(/remember /.test(m)){
      var match = m.match(/remember (that )?(.+)/i);
      if(match){this.remember('fact_'+Date.now(),match[2]);return 'Okay, I\\'ll remember: **'+match[2]+'** ✅'}
    }
    
    // What do you know
    if(/what do you know|what do you remember|你知道什么/.test(m)){
      var facts = Object.keys(this.facts).filter(function(k){return k!=='name'}).map(function(k){return BRAIN.facts[k].v});
      var name = this.recall('name');
      var r = 'Here\\'s what I remember:\\n';
      if(name) r += '\\n- **Your name:** '+name;
      for(var i=0;i<facts.length;i++) r += '\\n- '+facts[i];
      r += '\\n\\nWe\\'ve had **'+this.convos.length+'** conversations.';
      return r;
    }
    
    // Time
    if(/time|几点|现在/.test(m)){
      var d = new Date();
      return '🕐 **'+d.toLocaleString()+'**';
    }
    
    // Joke
    if(/joke|funny|laugh|笑话/.test(m)){
      var jokes = [
        'Why do programmers prefer dark mode? Light attracts bugs! 🐛',
        'A SQL query walks into a bar, sees two tables and asks: Can I JOIN you?',
        'Why was the JS developer sad? He didn\\'t Node how to Express himself!',
        'There are 10 types of people: those who understand binary and those who don\\'t.',
        'Why was the computer cold? It left its Windows open!'
      ];
      return jokes[Math.floor(Math.random()*jokes.length)];
    }
    
    // Math
    if(/^\d+\s*[\+\-\*\/]\s*\d+/.test(m) || /calculate|计算/.test(m)){
      var expr = m.replace(/[^0-9+\-*/().%\s]/g,'').trim();
      try{
        var r = Function('"use strict"; return ('+expr+')')();
        if(!isNaN(r)&&isFinite(r)) return '**'+expr+' = '+r+'** 🧮';
      }catch(e){}
    }
    
    // Create website/app
    if(/create|make|build|generate|write|创建|建立|做/.test(m)){
      if(/website|site|landing|web|网页|网站/.test(m)) return '```html\\n'+CODE.website+'\\n```\\n✅ **Website created!** Click the Code tab to preview.';
      if(/calculator|calc|计算器/.test(m)) return '```html\\n'+CODE.calculator+'\\n```\\n✅ **Calculator created!**';
      if(/login|sign.?in|register|登录|注册/.test(m)) return '```html\\n'+CODE.login+'\\n```\\n✅ **Login page created!**';
      if(/todo|task|待办|任务/.test(m)) return '```html\\n'+CODE.todo+'\\n```\\n✅ **Todo app created!**';
      if(/shop|store|ecommerce|商店|购物/.test(m)) return '```html\\n'+CODE.shop+'\\n```\\n✅ **Shop created!**';
      if(/dashboard|admin|仪表盘/.test(m)) return '```html\\n'+CODE.dashboard+'\\n```\\n✅ **Dashboard created!**';
      if(/music|player|音乐/.test(m)) return '```html\\n'+CODE.music+'\\n```\\n✅ **Music player created!**';
      if(/game|游戏/.test(m)) return '```html\\n'+CODE.game+'\\n```\\n✅ **Game created!**';
      if(/form|contact|表单/.test(m)) return '```html\\n'+CODE.form+'\\n```\\n✅ **Form created!**';
      if(/chat|messenger|聊天/.test(m)) return '```html\\n'+CODE.chat+'\\n```\\n✅ **Chat app created!**';
      if(/weather|天气/.test(m)) return '```html\\n'+CODE.weather+'\\n```\\n✅ **Weather app created!**';
      if(/timer|计时/.test(m)) return '```html\\n'+CODE.timer+'\\n```\\n✅ **Timer created!**';
      return 'Try saying: "create a website", "make a calculator", "build a shop", or "make a dashboard"';
    }
    
    // Search
    if(/search|google|find|搜索|查找/.test(m)){
      var match = m.match(/(?:search|google|find|搜索|查找)\s+(.+)/i);
      if(!match) match = m.match(/(?:search|google|find|搜索|查找)\s+(?:for\s+)?(.+)/i);
      if(match){
        window.open('https://www.google.com/search?q='+encodeURIComponent(match[1]),'_blank');
        return '🔍 Searching for **'+match[1]+'**...';
      }
      return 'What should I search for? Try "search AI news"';
    }
    
    // Open app
    if(/open /.test(m)){
      var apps = ['tiktok','youtube','instagram','twitter','chrome'];
      for(var i=0;i<apps.length;i++){
        if(m.indexOf(apps[i])>=0){
          window.open('https://'+apps[i]+'.com','_blank');
          return 'Opening **'+apps[i]+'**...';
        }
      }
      var url = m.match(/open (.+)/i);
      if(url) window.open('https://'+url[1],'_blank');
      return 'Opening...';
    }
    
    // Camera
    if(/camera|photo|拍照|相机/.test(m)){
      if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
        navigator.mediaDevices.getUserMedia({video:true}).then(function(s){s.getTracks().forEach(function(t){t.stop()});toast('📸 Camera opened','ok')}).catch(function(){});
      }
      return '📸 Opening camera...';
    }
    
    // Location
    if(/where am i|location|gps|定位|位置/.test(m)){
      navigator.geolocation.getCurrentPosition(function(p){
        toast('📍 '+p.coords.latitude.toFixed(4)+', '+p.coords.longitude.toFixed(4),'ok');
      },function(){},{timeout:5000});
      return '📍 Getting your location...';
    }
    
    // Battery
    if(/battery|电量/.test(m)){
      if(navigator.getBattery) navigator.getBattery().then(function(b){toast('🔋 '+Math.round(b.level*100)+'%','ok')});
      return '🔋 Checking battery...';
    }
    
    // Thanks
    if(/thank|thanks|谢谢/.test(m)) return 'You\\'re welcome! 😊 Always happy to help.';
    
    // Compliment
    if(/love|great|awesome|cool|amazing|棒|厉害/.test(m)){
      var name = this.recall('name');
      return 'Thanks'+(name?', '+name:'')+'! 😊 You\\'re awesome too!';
    }
    
    // Farewell
    if(/bye|goodbye|see you|再见|拜拜/.test(m)) return 'Goodbye! 👋 I\\'ll remember our chat. Come back anytime!';
    
    // Default response
    var name = this.recall('name');
    var defs = [
      'I hear you! Try asking me to "create a website", "search for something", or "tell me a joke"!',
      'Got it! I can create websites, search the web, code, and chat. What would you like to do?',
      'Interesting! Want me to build something? Just say "create a..." or "make a..."!'
    ];
    if(name) return 'Hey '+name+'! '+defs[Math.floor(Math.random()*defs.length)];
    return defs[Math.floor(Math.random()*defs.length)];
  }
};

/* ===== CODE TEMPLATES ===== */

      aDiv.querySelector('.msg-b').innerHTML = html;
      
      // Add copy buttons for code blocks
      aDiv.querySelectorAll('pre').forEach(function(pre){
        var btn = document.createElement('button');
        btn.textContent = '📋 Copy';
        btn.style.cssText = 'font-size:11px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--muted);cursor:pointer;margin-top:6px';
        btn.onclick = function(){
          navigator.clipboard.writeText(pre.textContent);
          btn.textContent = '✅ Copied!';
          setTimeout(function(){btn.textContent = '📋 Copy'}, 1500);
        };
        pre.after(btn);
      });
      
      DATA.push({r:'a',c:reply,t:Date.now()});
      TOKENS += msg.length + reply.length;
      save();
      
      msgs.scrollTop = msgs.scrollHeight;
    } catch(e) {
      aDiv.querySelector('.msg-b').innerHTML = '<span style="color:var(--red)">Error: '+esc(e.message)+'</span>';
    }
    BUSY = false;
    $('sendBtn').disabled = false;
    inp.focus();
  }, 300);
}

function ask(q){
  $('inp').value = q;
  send();
}

function clrChat(){
  if(!DATA.length) return;
  DATA = [];
  TOKENS = 0;
  save();
  render();
  toast('Chat cleared','ok');
}

function render(){
  var inner = document.querySelector('.msgs-inner');
  inner.innerHTML = '';
  
  if(!DATA.length){
    inner.innerHTML = '<div class="welcome" id="welcome"><div class="wlc-icon">⚡</div><div class="wlc-title">ENRIQUE AI</div><div class="wlc-sub">Your AI brain. Chat, code, create. 100% local.</div><div class="wlc-chips"><div class="wlc-chip" onclick="ask(\'Create a modern responsive website\')">🌐 Website</div><div class="wlc-chip" onclick="ask(\'Search latest AI news\')">🔍 Search</div><div class="wlc-chip" onclick="ask(\'Write a Python script\')">🐍 Python</div><div class="wlc-chip" onclick="ask(\'Build a calculator app\')">🧮 Calc</div><div class="wlc-chip" onclick="ask(\'Create a shop page\')">🛍️ Shop</div><div class="wlc-chip" onclick="ask(\'Build a dashboard\')">📊 Dashboard</div><div class="wlc-chip" onclick="ask(\'Tell me a joke\')">😂 Joke</div><div class="wlc-chip" onclick="ask(\'What can you do\')">💡 Help</div></div></div>';
    return;
  }
  
  DATA.forEach(function(m){
    var div = document.createElement('div');
    div.className = 'msg ' + (m.r === 'u' ? 'u' : 'a');
    var av = m.r === 'u' ? 'U' : 'E';
    var txt = esc(typeof m.c === 'string' ? m.c : '');
    if(m.r === 'a'){
      txt = txt
        .replace(/### (.+)/g, '<h3>$1</h3>')
        .replace(/## (.+)/g, '<h2>$1</h2>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>')
        .replace(/- (.+)/g, function(m,p1){return '• '+p1+'<br>'});
    }
    div.innerHTML = '<div class="msg-av">'+av+'</div><div class="msg-b">'+txt+'</div>';
    inner.appendChild(div);
  });
  
  msgs = $('msgs');
  msgs.scrollTop = msgs.scrollHeight;
}

/* History */
function showHist(){
  var list = $('histList');
  var html = '';
  var pairs = [];
  for(var i=0;i<DATA.length;i+=2){
    if(DATA[i]) pairs.push({q:DATA[i],a:DATA[i+1]||null});
  }
  if(!pairs.length){
    html = '<div style="text-align:center;padding:40px;color:var(--muted);font-size:14px">No history yet</div>';
  } else {
    pairs.reverse().forEach(function(p){
      html += '<div class="hist-item"><h4>'+esc(typeof p.q.c==='string'?p.q.c.slice(0,50):'')+'</h4><p>'+(p.a?esc(typeof p.a.c==='string'?p.a.c.slice(0,80):''):'')+'</p><div class="t">'+(p.q.t?new Date(p.q.t).toLocaleString():'')+'</div></div>';
    });
  }
  list.innerHTML = html;
  $('histPnl').classList.add('open');
}
function hideHist(){ $('histPnl').classList.remove('open'); }

/* Typing animation */
var style = document.createElement('style');
style.textContent = '.typing{display:flex;gap:4px;padding:4px 0}.typing span{width:5px;height:5px;border-radius:50%;background:var(--primary);animation:blink .8s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}';
document.head.appendChild(style);

/* Init */
render();
</script>
</body>
</html>
